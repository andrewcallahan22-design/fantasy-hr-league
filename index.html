  `;
}

// ── STANDINGS ──
// Three panels:
//   1. Monthly Winners (table) — one row per month, leader of that month, HR total.
//      Ties: both managers shown as co-winners; both get a Win credit (so 2-0-1 = 3 wins for season totals).
//   2. Season Standings (table) — manager, total HRs across all months, total month-wins.
//      Sorted by season HR descending; top 3 get medal emojis.
//   3. Month-by-Month Breakdown (table) — managers × months grid; each cell is THAT month's HR count
//      for THAT manager (not cumulative). Trophy emoji marks the leader(s) in each month column.
let _selectedStandingsMonth = null; // null = show all-time view

function renderStandings(body) {
  const { league } = CURRENT_LEAGUE;
  const months = Object.keys(league.months || {});
  if (!months.length) {
    body.innerHTML = '<div class="empty-state"><div class="empty-state-title">No months yet</div><div class="empty-state-body">Standings will appear once you have at least one month of play.</div></div>';
    return;
  }
  months.sort((a, b) => monthSortKey(a) - monthSortKey(b));

  // If we have a selected month filter, show that month's roster view
  const viewingMonth = _selectedStandingsMonth && months.includes(_selectedStandingsMonth)
    ? _selectedStandingsMonth : null;

  // Build a lookup: managerTotalsByMonth[month][manager] = HR count
  const monthTotals = {};
  const allManagers = new Set();
  for (const m of months) {
    const rosters = league.months[m]?.rosters || {};
    monthTotals[m] = {};
    for (const [mgr, roster] of Object.entries(rosters)) {
      allManagers.add(mgr);
      monthTotals[m][mgr] = (roster || []).reduce((s, p) => s + (parseInt(p.hr) || 0) + (parseInt(p.irHr) || 0) + (league.settings?.irHrCarryover === 'keep' ? (parseInt(p.hrFromSwapped) || 0) : 0), 0);
    }
  }
  // Include managers that exist in league.managers but might not yet have a roster in some month
  for (const mgr of (league.managers || [])) allManagers.add(mgr);
  const managers = [...allManagers];

  // For each month, find all leaders (ties → multiple)
  const monthlyLeaders = {};
  for (const m of months) {
    const totals = monthTotals[m];
    let max = -1;
    for (const mgr of managers) {
      const v = totals[mgr] ?? 0;
      if (v > max) max = v;
    }
    monthlyLeaders[m] = max > 0
      ? managers.filter(mgr => (totals[mgr] ?? 0) === max)
      : []; // no leader if max is 0
  }

  // Season totals: HR sum across months + count of months where this manager was (co-)leader
  const seasonStats = managers.map(mgr => ({
    manager: mgr,
    totalHR: months.reduce((s, m) => s + (monthTotals[m][mgr] ?? 0), 0),
    wins: months.filter(m => monthlyLeaders[m].includes(mgr)).length,
  })).sort((a, b) => b.totalHR - a.totalHR);

  // Medal lookup — handles ties in season standings (same totalHR = same medal)
  const medalFor = (idx, totalHR) => {
    // Find the first index with this same totalHR — gives consistent medal for tied totals
    const firstIdxAtSameTotal = seasonStats.findIndex(s => s.totalHR === totalHR);
    const m = ['🥇','🥈','🥉'];
    return m[firstIdxAtSameTotal] || '';
  };

  // ── PANEL 1: Monthly Winners ──
  const monthlyWinnersRows = months.map(m => {
    const leaders = monthlyLeaders[m];
    const max = leaders.length ? monthTotals[m][leaders[0]] : 0;
    const winnerCell = leaders.length
      ? leaders.map(mgr => `<span style="display:inline-block;background:var(--accent);color:var(--bg);padding:3px 11px;border-radius:14px;font-weight:700;font-size:12px;letter-spacing:0.04em;margin-right:6px;text-transform:uppercase">${escapeHtml(mgr)}</span>`).join('')
      : '<span style="color:var(--text-faint);font-style:italic">—</span>';
    return `<tr>
      <td>${escapeHtml(m)}</td>
      <td>${winnerCell}</td>
      <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:600;color:var(--text)">${max || 0}</td>
    </tr>`;
  }).join('');

  // ── PANEL 2: Season Standings ──
  const seasonRows = seasonStats.map((s, i) => `
    <tr>
      <td><strong>${medalFor(i, s.totalHR)} ${escapeHtml(s.manager)}</strong></td>
      <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:600;color:var(--text)">${s.totalHR}</td>
      <td class="right" style="font-family:'Roboto Mono',monospace;color:var(--text-dim)">${s.wins}</td>
    </tr>
  `).join('');

  // ── PANEL 3: Month-by-Month Breakdown ──
  // Sort managers by season HR descending (matches Season Standings ordering)
  const breakdownManagers = [...seasonStats];
  const monthHeaderCells = months.map(m => `<th class="right">${escapeHtml(m.split('-')[0].slice(0,3).toUpperCase())}</th>`).join('');
  const breakdownRows = breakdownManagers.map(s => {
    const monthCells = months.map(m => {
      const hr = monthTotals[m][s.manager] ?? 0;
      const isLeader = monthlyLeaders[m].includes(s.manager);
      const trophy = isLeader ? '🏆 ' : '';
      return `<td class="right" style="font-family:'Roboto Mono',monospace;${isLeader ? 'color:var(--accent);font-weight:600;' : 'color:var(--text-dim);'}">${trophy}${hr}</td>`;
    }).join('');
    return `<tr>
      <td><strong>${escapeHtml(s.manager)}</strong></td>
      ${monthCells}
      <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:700;color:var(--text);border-left:1px solid var(--panel-border)">${s.totalHR}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <!-- Month selector tabs — click any month to see that month's roster -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-right:4px">View month:</span>
      <button class="btn btn-sm ${!viewingMonth ? 'btn-primary' : 'btn-ghost'}" onclick="_selectedStandingsMonth=null;renderStandings(document.getElementById('tab-body'))">Season</button>
      ${months.map(m => `
        <button class="btn btn-sm ${viewingMonth === m ? 'btn-primary' : 'btn-ghost'}" onclick="_selectedStandingsMonth='${escapeAttr(m)}';renderStandings(document.getElementById('tab-body'))">${escapeHtml(m.split('-')[0])}</button>
      `).join('')}
    </div>

    ${viewingMonth ? `
      <!-- Single month roster view -->
      <div class="notice info" style="margin-bottom:14px">Showing <strong>${escapeHtml(viewingMonth)}</strong> rosters — click a player name to view their profile.</div>
      ${managers.map(mgr => {
        const roster = league.months[viewingMonth]?.rosters?.[mgr] || [];
        const total  = roster.reduce((s, p) => s + (parseInt(p.hr) || 0) + (league.settings?.irHrCarryover === 'keep' ? (parseInt(p.hrFromSwapped) || 0) : 0), 0);
        const isLeader = monthlyLeaders[viewingMonth]?.includes(mgr);
        return `
          <div class="panel" style="margin-bottom:12px">
            <div class="panel-header">
              ${isLeader ? '🏆 ' : ''}${escapeHtml(mgr)}
              <span style="font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent)">${total} HR</span>
            </div>
            <div class="panel-body" style="padding:0">
              <table class="data-table">
                <thead><tr><th>Player</th><th>Team</th><th>Pos</th><th class="right">HR</th></tr></thead>
                <tbody>
                  ${roster.map(p => p.player ? `
                    <tr>
                      <td>
                        <button data-player="${escapeAttr(p.player)}" onclick="openPlayerProfile(this.dataset.player, null)" style="background:none;border:none;padding:0;cursor:pointer;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(240,199,94,0.4)">${escapeHtml(p.player)}</button>
                      </td>
                      <td><span class="team-chip" style="font-size:10px">${escapeHtml(p.team || '—')}</span></td>
                      <td><span class="pos-chip" style="font-size:10px">${escapeHtml(p.position || p.pos || '—')}</span></td>
                      <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:700">${p.hr || 0}</td>
                    </tr>
                  ` : `<tr><td colspan="4" style="color:var(--text-faint);font-style:italic">— empty slot —</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('')}
    ` : `
      <!-- Season-long view: Monthly Winners + Season Standings + Breakdown -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px">
        <div class="panel" style="margin:0">
          <div class="panel-header">Monthly Winners</div>
          <div class="panel-body" style="padding:0">
            <table class="data-table">
              <thead><tr><th>Month</th><th>Winner</th><th class="right">HR</th></tr></thead>
              <tbody>${monthlyWinnersRows}</tbody>
            </table>
          </div>
        </div>
        <div class="panel" style="margin:0">
          <div class="panel-header">Season Standings</div>
          <div class="panel-body" style="padding:0">
            <table class="data-table">
              <thead><tr><th>Manager</th><th class="right">Total HR</th><th class="right">Wins</th></tr></thead>
              <tbody>${seasonRows}</tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">Month-by-Month Breakdown</div>
        <div class="panel-body" style="padding:0;overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>Manager</th>${monthHeaderCells}<th class="right" style="border-left:1px solid var(--panel-border)">Total</th></tr></thead>
            <tbody>${breakdownRows}</tbody>
          </table>
        </div>
      </div>
    `}
  `;
}

// Helper: chronological sort key for "MonthName-Year" strings.
// "April-2026" → 2026 * 12 + 3 (April is index 3 zero-based).
function monthSortKey(key) {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [m, y] = key.split('-');
  return (parseInt(y) || 0) * 12 + MONTHS.indexOf(m);
}
function nextMonthKey(key) {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [m, y] = key.split('-');
  let mi = MONTHS.indexOf(m) + 1, yi = parseInt(y);
  if (mi > 11) { mi = 0; yi++; }
  return `${MONTHS[mi]}-${yi}`;
}


function renderRostersEdit(body) {
  if (!body || typeof body.innerHTML === 'undefined') {
    body = document.getElementById('tab-body');
  }
  if (!body) return;
  const { league, isCommish, myManager } = CURRENT_LEAGUE;
  const isAdmin    = SESSION?.isAdmin;
  const irSlots    = parseInt(league.settings?.irSlots) || 0;
  const waiverType = league.settings?.waiverType || 'none';
  const allMonths  = Object.keys(league.months || {}).sort((a,b) => {
    // Sort months chronologically
    const parse = m => { const [mo,yr] = m.split('-'); const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December']; return parseInt(yr)*12+MONTHS.indexOf(mo); };
    return parse(b) - parse(a); // newest first
  });
  const currentMonth = league.currentMonth;

  // Which manager to show — own roster by default, commissioner can pick any
  const viewMgr = _rosterViewMgr || myManager || (isCommish || isAdmin ? league.managers[0] : null);
  const viewMonth = _rosterViewMonth || currentMonth;

  const rostersLiveAt = league.months?.[currentMonth]?.rostersLiveAt || league.draftClosedAt;
  const liveLabel = rostersLiveAt
    ? `Tracking since ${new Date(rostersLiveAt).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`
    : league.draft?.status === 'active' ? 'Draft in progress' : 'Active';

  if (!viewMgr) {
    body.innerHTML = `<div class="notice info">You don't have a roster in this league yet. You'll need to be approved and complete the draft first.</div>`;
    return;
  }

  const month = league.months?.[viewMonth];
  const roster = month?.rosters?.[viewMgr] || [];
  const irCount = roster.filter(s => s.irPlayer).length;
  const isCurrentMonth = viewMonth === currentMonth;
  const canEdit = (isCommish || isAdmin) || (isCurrentMonth && viewMgr === myManager);

  // Month total HR (including IR HRs)
  const totalHR = roster.reduce((s, p) => s + (parseInt(p.irHr)||0) + (parseInt(p.hr)||0) + (league.settings?.irHrCarryover === 'keep' ? (parseInt(p.hrFromSwapped)||0) : 0), 0);

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
      <div>
        <div style="font-size:22px;font-weight:800;color:var(--text)">${escapeHtml(viewMgr)}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:2px">
          ${escapeHtml(viewMonth)} · <strong style="color:var(--accent)">${totalHR} HR</strong>
          ${irSlots ? ` · IR: ${irCount}/${irSlots}` : ''}
          · <span style="color:var(--text-faint);font-size:11px">${escapeHtml(liveLabel)}</span>
          ${(isCommish || isAdmin) ? ` · <span style="color:var(--text-faint);font-size:11px">✏ Click HR to edit</span>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${allMonths.length > 1 ? `
          <select class="select" style="font-size:12px;padding:5px 10px" onchange="renderRostersWithOptions(document.getElementById('tab-body'), '${escapeAttr(viewMgr)}', this.value)">
            ${allMonths.map(m => `<option value="${escapeAttr(m)}" ${m===viewMonth?'selected':''}>${escapeHtml(m)}${m===currentMonth?' (current)':(monthSortKey(m)>monthSortKey(currentMonth)?' (upcoming)':'')}</option>`).join('')}
          </select>
        ` : ''}
        ${(isCommish || isAdmin) && league.managers.length > 1 ? `
          <select class="select" style="font-size:12px;padding:5px 10px" onchange="renderRostersWithOptions(document.getElementById('tab-body'), this.value, '${escapeAttr(viewMonth)}')">
            ${league.managers.map(m => `<option value="${escapeAttr(m)}" ${m===viewMgr?'selected':''}>${escapeHtml(m)}</option>`).join('')}
          </select>
        ` : ''}
      </div>
    </div>
  `;

  if (!month) {
    body.innerHTML = html + `<div class="notice info">No roster data for ${escapeHtml(viewMonth)}.</div>`;
    return;
  }

  if (roster.length === 0 || roster.every(p => !p.player && !p.irPlayer)) {
    body.innerHTML = html + `<div class="notice info">Roster is empty — complete the draft to fill it.</div>`;
    return;
  }

  // IR explanation banner
  if (irSlots > 0 && isCurrentMonth && viewMgr === myManager) {
    html += `
      <div class="notice info" style="margin-bottom:14px">
        <strong>🏥 IR slots:</strong> If one of your players is on the MLB Injured List, tap <strong>→ IR</strong> to move them to an IR slot. Their HRs before the injury still count. You can then pick up a replacement from the waiver wire.
        When they recover, tap <strong>↩ Return</strong> to put them back in your lineup.
      </div>
    `;
  }

  const irMode      = league.settings?.irMode || 'hold';
  const hrCarryover = league.settings?.irHrCarryover || 'keep';

  // ── STARTER SLOTS ──
  // In both modes, render active starters here.
  // In swap mode, swapped-out slots show the replacement with a swap badge.
  html += `<div class="panel" style="margin-bottom:12px"><div class="panel-body" style="padding:0"><table class="data-table">
    <thead><tr>
      <th>Player</th>
      <th>Team</th>
      <th>Pos</th>
      <th>Next</th>
      <th class="right">HR</th>
      ${canEdit ? '<th style="text-align:center"></th>' : ''}
    </tr></thead>
    <tbody>`;

  for (let i = 0; i < roster.length; i++) {
    const p = roster[i];
    if (p.irPlayer) continue; // True IR mode — rendered in IR section below

    const healthObj = league.health?.[normNameFE(p.player || '')];
    const health = typeof healthObj === 'string' ? healthObj : (healthObj?.status || healthObj?.code || '');
    const isIL = health.toLowerCase().includes('il') || health.toLowerCase().includes('dl') || health.toLowerCase().includes('day');
    const canMoveToIR = canEdit && irSlots > 0 && p.player && (isIL || isCommish || isAdmin) && irCount < irSlots;
    const hasSwap = !!p.swappedOut; // Permanent swap mode — slot shows replacement

    // Swap mode: show carryover HRs + replacement HRs
    const displayHR = hasSwap
      ? (parseInt(p.hrFromSwapped)||0) + (parseInt(p.hr)||0)
      : parseInt(p.hr)||0;

    const playerNameCell = p.player
      ? `<div>
           <button data-player="${escapeAttr(p.player)}" onclick="openPlayerProfile(this.dataset.player,null)"
             class="player-link" style="font-size:13px;font-weight:600">${escapeHtml(p.player)}</button>

           ${hasSwap ? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px">
             ⇄ Replaced <button data-player="${escapeAttr(p.swappedOut)}" onclick="openPlayerProfile(this.dataset.player,null)" class="player-link" style="font-size:10px">${escapeHtml(p.swappedOut)}</button>
             on ${new Date(p.swappedOutAt||Date.now()).toLocaleDateString('en-US',{month:'short',day:'numeric'})}

           </div>` : ''}
         </div>`
      : `<span style="color:var(--text-faint);font-size:13px">Empty slot</span>`;

    const nextGame = p.player ? league.nextGame?.[normNameFE(p.player)] : null;

    html += `<tr>
      <td>${playerNameCell}</td>
      <td style="font-size:12px">${escapeHtml(p.team||'') || '—'}</td>
      <td style="font-size:12px">${escapeHtml(p.position||'') || '—'}</td>
      <td>${p.player ? nextGameBadge(nextGame) : '<span style="color:var(--text-faint);font-size:11px">—</span>'}</td>
      <td class="right">
        ${(isCommish || isAdmin)
          ? `<input class="hr-input" type="number" min="0" value="${displayHR}"
               oninput="editSlot('${escapeAttr(viewMgr)}',${i},'hr',this.value,this)"
               title="Click to edit" style="width:52px;text-align:right">`
          : `<span style="font-family:'Roboto Mono',monospace;font-weight:700">${displayHR}</span>`}
      </td>
      ${canEdit ? `<td style="text-align:center">
        ${canMoveToIR && !hasSwap ? `<button class="btn btn-sm" style="font-size:11px;background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.3)" onclick="moveToIR('${escapeAttr(viewMgr)}',${i})">${irMode==='swap' ? '⇄ Swap out' : '→ IR'}</button>` : ''}
        ${!p.player && canEdit ? `<button class="btn btn-sm btn-ghost" style="font-size:11px;color:var(--accent)" onclick="openWaiverClaim('${escapeAttr(viewMgr)}',${i})">+ Pick up player</button>` : ''}
      </td>` : ''}
    </tr>`;
  }

  html += `</tbody></table></div></div>`;

  // ── TRUE IR SECTION (hold mode only) ──
  const irSlotIndices = roster.map((p,i) => p.irPlayer ? i : -1).filter(i => i >= 0);
  const emptyIRCount = Math.max(0, irSlots - irSlotIndices.length);

  if (irMode === 'hold' && irSlots > 0 && (irSlotIndices.length > 0 || isCurrentMonth)) {
    html += `<div class="panel" style="margin-bottom:12px;border-color:rgba(239,68,68,0.3)">
      <div class="panel-header" style="color:var(--red);font-size:12px">🏥 Injured Reserve (${irSlotIndices.length}/${irSlots} used)</div>
      <div class="panel-body" style="padding:0">`;

    for (const i of irSlotIndices) {
      const p = roster[i];
      const replacementHR = parseInt(p.hr) || 0;
      const irPlayerHR = parseInt(p.irHr) || 0;
      const totalSlotHR = irPlayerHR + replacementHR;

      html += `
        <div style="padding:12px 14px;border-bottom:1px dashed rgba(239,68,68,0.2)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="font-size:10px;font-weight:700;color:var(--red);background:rgba(239,68,68,0.12);padding:2px 6px;border-radius:3px;flex-shrink:0">IR</span>
            <div style="flex:1">
              <button data-player="${escapeAttr(p.irPlayer)}" onclick="openPlayerProfile(this.dataset.player,null)"
                class="player-link" style="font-size:13px;font-weight:700">${escapeHtml(p.irPlayer)}</button>
              <span style="font-size:11px;color:var(--text-muted);margin-left:8px">${escapeHtml(p.irTeam)} · ${escapeHtml(p.irPosition)}</span>
              ${p.irMovedAt ? `<span style="font-size:10px;color:var(--text-faint);margin-left:8px">since ${new Date(p.irMovedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>` : ''}
            </div>
            <div style="text-align:right">
              <div style="font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px">${irPlayerHR} HR</div>
              <div style="font-size:9px;color:var(--text-faint)">${hrCarryover==='keep' ? 'carried over' : 'not counted'}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(0,0,0,0.2);border-radius:6px;margin-bottom:8px">
            <span style="font-size:10px;font-weight:700;color:var(--text-muted);background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:3px;flex-shrink:0">FILL</span>
            ${p.player ? `
              <div style="flex:1">
                <button data-player="${escapeAttr(p.player)}" onclick="openPlayerProfile(this.dataset.player,null)"
                  class="player-link" style="font-size:13px;font-weight:600">${escapeHtml(p.player)}</button>
                <span style="font-size:11px;color:var(--text-muted);margin-left:8px">${escapeHtml(p.team||'')} · ${escapeHtml(p.position||'')}</span>
              </div>
              <div style="text-align:right">
                <div style="font-family:'Roboto Mono',monospace;font-weight:700;font-size:14px">${replacementHR} HR</div>
                <div style="font-size:9px;color:var(--text-faint)">as fill-in</div>
              </div>
            ` : `
              <div style="flex:1;color:var(--text-faint);font-size:12px">No replacement yet</div>
              ${canEdit ? `<button class="btn btn-sm btn-ghost" style="font-size:11px;color:var(--accent)" onclick="openWaiverClaim('${escapeAttr(viewMgr)}',${i})">+ Pick up player</button>` : ''}
            `}
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
            <div style="font-size:12px;color:var(--text-muted)">
              Total: <strong style="color:var(--accent)">${totalSlotHR} HR</strong>
              <span style="font-size:11px;color:var(--text-faint)">(${irPlayerHR} + ${replacementHR})</span>
            </div>
            <div style="display:flex;gap:6px">
              ${p.player && canEdit ? `<button class="btn btn-sm btn-ghost" style="font-size:11px" onclick="openWaiverClaim('${escapeAttr(viewMgr)}',${i})">⇄ Change</button>` : ''}
              ${canEdit ? `<button class="btn btn-sm btn-ghost" style="font-size:11px;color:var(--green)" onclick="returnFromIR('${escapeAttr(viewMgr)}',${i})">↩ Return to lineup</button>` : ''}
            </div>
          </div>
        </div>`;
    }

    for (let n = 0; n < emptyIRCount; n++) {
      html += `<div style="padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--text-faint)">
        <span style="font-size:10px;font-weight:700;color:var(--red);background:rgba(239,68,68,0.08);padding:2px 6px;border-radius:3px">IR</span>
        <span style="font-size:12px">Empty — tap <strong style="color:var(--red)">→ IR</strong> on an injured starter to use this slot</span>
      </div>`;
    }
    html += `</div></div>`;
  }


  // Past months summary
  if (allMonths.length > 1) {
    html += `
      <div class="panel" style="margin-top:16px">
        <div class="panel-header">Monthly history — ${escapeHtml(viewMgr)}</div>
        <div class="panel-body" style="padding:0">
          <table class="data-table">
            <thead><tr><th>Month</th><th class="right">HR</th><th>IR Activity</th><th style="text-align:center">Result</th></tr></thead>
            <tbody>
              ${allMonths.map(m => {
                const mRoster = league.months[m]?.rosters?.[viewMgr] || [];
                const mHR = mRoster.reduce((s,p) => s + (parseInt(p.irHr)||0) + (parseInt(p.hr)||0) + (league.settings?.irHrCarryover === 'keep' ? (parseInt(p.hrFromSwapped)||0) : 0), 0);
                const isActive = m === currentMonth;
                // Collect IR history from all slots this month
                const irRecords = mRoster.flatMap(p => p.irHistory || []);
                const irCell = irRecords.length
                  ? irRecords.map(r => `<span style="font-size:11px;color:var(--text-muted)">
                      🏥 <strong>${escapeHtml(r.replacement)}</strong> filled in → <strong style="color:var(--accent)">${r.replacementHR} HR</strong>
                    </span>`).join('<br>')
                  : '<span style="font-size:11px;color:var(--text-faint)">—</span>';
                return `<tr style="${isActive ? 'background:rgba(240,199,94,0.05)' : ''}">
                  <td>
                    <button class="btn btn-sm btn-ghost" style="font-size:12px" onclick="renderRostersWithOptions(document.getElementById('tab-body'), '${escapeAttr(viewMgr)}', '${escapeAttr(m)}')">${escapeHtml(m)}${isActive?' <span style="font-size:9px;color:var(--accent)">(current)</span>':''}</button>
                  </td>
                  <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:700">${mHR}</td>
                  <td>${irCell}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text-muted)">${isActive ? '—' : '✓ Final'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  body.innerHTML = html;
  _rosterViewMgr = viewMgr;
  _rosterViewMonth = viewMonth;

// Simple client-side normName for health lookups
function normNameFE(s) {
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}

// Some code paths produce a team abbreviation from this app's own hardcoded
// TEAM_ABBR table, others pull it straight from MLB's live API \u2014 and the two
// disagree for 3 teams (verified against MLB's API directly): Arizona (ARI
// vs real AZ), San Francisco (SFG vs real SF), Chicago White Sox (CHW vs
// real CWS). Normalize at comparison time so team-uniqueness checks are safe
// regardless of which form any given piece of code or stored data uses \u2014
// this is exactly how two managers ended up with a White Sox player each
// despite an all-unique team rule (see matching helper in lib/core.mjs).
const TEAM_SYNONYMS_FE = { ARI: 'AZ', SFG: 'SF', CHW: 'CWS' };
function normTeamFE(t) {
  const up = String(t || '').trim().toUpperCase();
  return TEAM_SYNONYMS_FE[up] || up;
}

async function moveToIR(mgr, slotIndex) {
  const slot = CURRENT_LEAGUE?.league?.months?.[CURRENT_LEAGUE.league.currentMonth]?.rosters?.[mgr]?.[slotIndex];
  const playerName = slot?.player || 'this player';
  if (!await confirmDialog(`Move ${playerName} to the IR slot? Their current HRs will be preserved. You can then pick up a replacement using the waiver wire.`)) return;
  const { isCommish } = CURRENT_LEAGUE;
  const r = await fetch(API_LEAGUE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({
      action: 'move-to-ir',
      leagueId: CURRENT_LEAGUE.league.id,
      manager: mgr,
      slotIndex,
      forceCommish: isCommish || SESSION?.isAdmin,
    }),
  });
  const res = await r.json();
  if (!res.ok) { toastErr(res.error); return; }
  toastOk(`✓ ${playerName} moved to IR — pick up a replacement whenever you're ready.`);
  await refreshLeague();
  renderActiveTab();
}

async function returnFromIR(mgr, slotIndex) {
  const slot = CURRENT_LEAGUE?.league?.months?.[CURRENT_LEAGUE.league.currentMonth]?.rosters?.[mgr]?.[slotIndex];
  const playerName = slot?.irPlayer || 'this player';
  if (!await confirmDialog(`Return ${playerName} to the active lineup? The temporary replacement will be dropped.`)) return;
  const r = await fetch(API_LEAGUE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ action: 'return-from-ir', leagueId: CURRENT_LEAGUE.league.id, manager: mgr, slotIndex }),
  });
  const res = await r.json();
  if (!res.ok) { toastErr(res.error); return; }
  toastOk(`✓ ${playerName} is back in the active lineup.`);
  await refreshLeague();
  renderActiveTab();
}

function openWaiverClaim(mgr, slotIndex) {
  const { league } = CURRENT_LEAGUE;
  const month = league.months?.[league.currentMonth];
  const slot = month?.rosters?.[mgr]?.[slotIndex];
  const irRule      = league.settings?.irReplacementRule || 'any-available';
  const sameTeam    = slot?.irPlayer && irRule === 'same-team';
  const positionRule = league.settings?.positionRule || 'one-duplicate-allowed';

  // Build set of all players/teams already on any roster
  const takenNames = new Set();
  const takenTeams = new Set(); // for all-unique team rule
  for (const [, r] of Object.entries(month?.rosters || {})) {
    for (const p of r) {
      if (p.player)   takenNames.add(normNameFE(p.player));
      if (p.irPlayer) takenNames.add(normNameFE(p.irPlayer));
      // Track taken teams so loadWaiverPool knows which teams are still available
      if (p.team)   takenTeams.add(normTeamFE(p.team));
      if (p.irTeam) takenTeams.add(normTeamFE(p.irTeam));
    }
  }

  // For IR replacement, the injured player still "holds" their position logically.
  // We only block positions that are STRICTLY OVER the limit —
  // meaning adding another player there would create a violation.
  // Since Buxton holds CF, the slot is open but CF is still accounted for,
  // so we don't subtract the slot position — we just check what's over limit.
  const myRoster = month?.rosters?.[mgr] || [];
  const posCounts = {};
  for (const p of myRoster) {
    const pos = p.irPlayer ? p.irPosition : p.position;
    if (pos) posCounts[pos] = (posCounts[pos] || 0) + 1;
  }

  const maxPerPos = positionRule === 'all-unique' ? 1
    : positionRule === 'unrestricted' ? Infinity
    : 2; // one-duplicate-allowed

  // Only block positions that are already AT or OVER the limit
  // AND where adding another player would actually violate the rule
  // For the open IR slot itself, don't count it as filled
  const openSlotPos = slot?.irPlayer ? slot.irPosition : null;
  const blockedPositions = new Set(
    Object.entries(posCounts)
      .filter(([pos, count]) => {
        // The open slot position doesn't count toward blocking since the
        // replacement fills that same logical slot
        const effectiveCount = pos === openSlotPos ? count - 1 : count;
        return effectiveCount >= maxPerPos;
      })
      .map(([pos]) => pos)
  );

  _waiverSelected = null;
  window._waiverPositionRule = positionRule; // for error messages

  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay open';
  wrap.id = 'waiver-modal';
  wrap.innerHTML = `
    <div class="modal" style="max-width:580px;width:100%;margin:auto">
      <div class="modal-head">
        <div class="modal-title">🏥 Pick up replacement for ${escapeHtml(slot?.irPlayer || '?')}</div>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div style="padding:10px 16px;background:rgba(239,68,68,0.06);border-bottom:1px solid var(--panel-border);font-size:12px;color:var(--text-muted)">
        Temporary replacement for <strong style="color:var(--text)">${escapeHtml(slot?.irPlayer || '')}</strong>
        ${sameTeam ? ` · <span style="color:var(--accent)">Showing ${escapeHtml(slot?.irTeam || '')} players only (same-team rule)</span>` : ''}
        ${!sameTeam && (league.settings?.teamRule || 'all-unique') === 'all-unique' ? ` · <span style="color:var(--accent)">Teams already on a roster are excluded</span>` : ''}
        ${blockedPositions.size ? ` · <span style="color:var(--orange)">Positions at limit: ${[...blockedPositions].join(', ')}</span>` : ''}
      </div>
      <div style="padding:8px 16px;border-bottom:1px solid var(--panel-border);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input class="input compact" id="waiver-search" placeholder="Filter by name or team…" style="flex:1;min-width:120px;max-width:200px" oninput="filterWaiverPool()">
        <select class="select" id="waiver-pos-filter" style="font-size:12px;padding:5px 8px" onchange="filterWaiverPool()">
          <option value="">All positions</option>
          <option value="C">C</option>
          <option value="1B">1B</option>
          <option value="2B">2B</option>
          <option value="3B">3B</option>
          <option value="SS">SS</option>
          <option value="LF">LF</option>
          <option value="CF">CF</option>
          <option value="RF">RF</option>
          <option value="OF">OF</option>
          <option value="DH">DH</option>
        </select>
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap" id="waiver-count"></span>
      </div>
      <div id="waiver-pool-list" class="modal-body" style="padding:0;max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">Loading…</div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--panel-border);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div id="waiver-selection-display" style="flex:1;font-size:13px;color:var(--text-faint)">Select a player above</div>
        <button class="btn btn-primary" id="waiver-confirm-btn" disabled onclick="submitWaiverClaim('${escapeAttr(mgr)}',${slotIndex})">Confirm pickup</button>
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  // League-wide teamRule and positionRule always apply, regardless of which
  // irReplacementRule the league picked — those are separate concerns:
  // irReplacementRule narrows WHICH team an IR replacement can come from;
  // teamRule/positionRule govern whether a player is a legal roster addition
  // at all. A pickup that violates the league's own roster rules was never
  // "available" in the first place. same-team layers an extra restriction
  // (must match the injured player's specific team) on top of that baseline.
  const teamRule = league.settings?.teamRule || 'all-unique';
  const poolTeamFilter = sameTeam ? slot.irTeam : null;
  const poolTakenTeams = teamRule === 'all-unique' ? takenTeams : new Set();
  const poolBlockedPos = blockedPositions;
  loadWaiverPool(league, takenNames, poolTakenTeams, poolTeamFilter, poolBlockedPos);
}

let _waiverPool = [];
let _waiverSelected = null;
let _waiverBlockedPositions = new Set();

async function loadWaiverPool(league, takenNames, takenTeams, requiredTeam, blockedPositions = new Set()) {
  const listEl = document.getElementById('waiver-pool-list');
  const countEl = document.getElementById('waiver-count');
  if (!listEl) return;
  listEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">Loading available players…</div>';

  try {
    const season = new Date().getFullYear();
    let allPlayers = [];

    // Real season HR for every player comes from hydrating stats directly on
    // each team's roster fetch — NOT from the "leaders" endpoint. That
    // endpoint silently caps around the top ~100-150 hitters league-wide
    // (confirmed: requesting limit=500 only ever returns players with
    // double-digit HR totals), so anyone outside that tier — the majority of
    // real waiver-wire players — always showed as 0 HR regardless of their
    // actual total. Hydration gives the true number for every single player.
    const teamsResp = await fetch(`https://statsapi.mlb.com/api/v1/teams?sportId=1&season=${season}`);
    const teamsData = await teamsResp.json();
    const allTeams = (teamsData.teams || []).filter(t => t.sport?.id === 1);

    const teamsToFetch = requiredTeam
      ? allTeams.filter(t => normTeamFE(t.abbreviation) === normTeamFE(requiredTeam))
      : allTeams.filter(t => !takenTeams.has(normTeamFE(t.abbreviation)));

    if (listEl) listEl.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">Loading rosters from ${teamsToFetch.length} team${teamsToFetch.length===1?'':'s'}…</div>`;

    const BATCH = 8;
    for (let i = 0; i < teamsToFetch.length; i += BATCH) {
      const batch = teamsToFetch.slice(i, i + BATCH);
      const results = await Promise.all(batch.map(async t => {
        try {
          const r = await fetch(`https://statsapi.mlb.com/api/v1/teams/${t.id}/roster?rosterType=active&season=${season}&hydrate=person(stats(type=season,group=hitting))`);
          if (!r.ok) return [];
          const data = await r.json();
          return (data.roster || [])
            .filter(p => p.position?.abbreviation !== 'P') // hitters only — this is a HR-only league
            .map(p => ({
              name:   p.person?.fullName || '',
              team:   t.abbreviation || '?',
              pos:    p.position?.abbreviation || '?',
              hr:     parseInt(p.person?.stats?.[0]?.splits?.[0]?.stat?.homeRuns) || 0,
              prevHR: null,
              id:     p.person?.id,
            }));
        } catch { return []; }
      }));
      allPlayers.push(...results.flat());
    }

    // Filter players based on rules — always applied regardless of the
    // league's specific irReplacementRule, since teamRule/positionRule are
    // league-wide roster rules, not something specific to one IR mode.
    _waiverPool = allPlayers.filter(p => {
      if (!p.name) return false;
      if (takenNames.has(normNameFE(p.name))) return false;
      if (requiredTeam && normTeamFE(p.team) !== normTeamFE(requiredTeam)) return false;
      if (takenTeams.size && takenTeams.has(normTeamFE(p.team))) return false;
      if (blockedPositions.size && blockedPositions.has(p.pos)) return false;
      return true;
    });

    // Sort: by HR desc, then alphabetically
    _waiverPool.sort((a, b) => (b.hr || 0) - (a.hr || 0) || a.name.localeCompare(b.name));
    _waiverBlockedPositions = blockedPositions;
    window._waiverPositionRule = league.settings?.positionRule || 'one-duplicate-allowed';

    renderWaiverPool();
  } catch (e) {
    if (listEl) listEl.innerHTML = `<div style="padding:20px;color:var(--red);font-size:13px">Failed to load players: ${escapeHtml(e.message)}</div>`;
  }
}

function filterWaiverPool() {
  renderWaiverPool();
}

function renderWaiverPool() {
  const el = document.getElementById('waiver-pool-list');
  const countEl = document.getElementById('waiver-count');
  if (!el) return;

  const search    = (document.getElementById('waiver-search')?.value || '').toLowerCase();
  const posFilter = document.getElementById('waiver-pos-filter')?.value || '';

  const filtered = _waiverPool.filter(p => {
    if (posFilter && p.pos !== posFilter) return false;

  if (countEl) countEl.textContent = `${filtered.length} players`;

  if (!filtered.length) {

  }

  el.innerHTML = `<table class="data-table" style="margin:0">
    <thead><tr>
      <th>Player</th>
      <th>Team</th>
      <th>Pos</th>
      <th class="right">Season HR</th>

        const isSelected = _waiverSelected && normNameFE(_waiverSelected.name) === normNameFE(p.name);
        return `<tr style="${isSelected ? 'background:rgba(58,160,92,0.1)' : ''}">
          <td>
            <button data-player="${escapeAttr(p.name)}" onclick="openPlayerProfile(this.dataset.player,null)"
              class="player-link" style="font-size:13px;font-weight:600">${escapeHtml(p.name)}</button>
          </td>
          <td><span class="team-chip" style="font-size:9px">${escapeHtml(p.team||'?')}</span></td>
          <td><span class="pos-chip" style="font-size:9px">${escapeHtml(p.pos||'?')}</span></td>
          <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:700">${p.hr ?? '—'}</td>
          <td class="right" style="font-family:'Roboto Mono',monospace;color:var(--text-muted)">${p.prevHR !== undefined ? p.prevHR : '—'}</td>
          <td style="text-align:center">
            <button class="btn btn-sm ${isSelected ? 'btn-primary' : 'btn-ghost'}" style="font-size:11px"
              onclick='selectWaiverPlayer(${JSON.stringify({name:p.name, team:p.team, pos:p.pos, id:p.id})})'>

}

async function submitWaiverClaim(mgr, slotIndex) {
  if (!_waiverSelected) { toastErr('Search for and select a player first'); return; }

  const { name: pickupPlayer, team: pickupTeam, pos: pickupPos } = _waiverSelected;
  const btn = document.getElementById('waiver-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Claiming…'; }

  const r = await fetch(API_LEAGUE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({
      action: 'waiver-claim',
      leagueId: CURRENT_LEAGUE.league.id,
      manager: mgr,
      slotIndex,
      pickupPlayer,
      pickupTeam,
      pickupPos,
    }),
  });
  const res = await r.json();
  if (!res.ok) {
    toastErr(res.error || 'Failed');
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm pickup'; }
    return;
  }
  _waiverSelected = null;
  document.getElementById('waiver-modal')?.remove();
  toastOk(`✓ ${pickupPlayer} added to your roster.`);
  await refreshLeague();
  renderActiveTab();
}
const _editSlotTimers = {};
async function editSlot(manager, slotIndex, field, value, inputEl) {
  // Debounce — cancel pending save for this slot, wait for typing to stop
  const key = `${manager}-${slotIndex}-${field}`;
  if (_editSlotTimers[key]) clearTimeout(_editSlotTimers[key]);

  if (inputEl) { inputEl.classList.add('saving'); inputEl.classList.remove('saved'); }

  _editSlotTimers[key] = setTimeout(async () => {
    const viewMonth = _rosterViewMonth || CURRENT_LEAGUE?.league?.currentMonth;
    try {
      const r = await fetch(API_LEAGUE, {
        method: 'POST',
        headers: {'Content-Type':'application/json', ...authHeaders()},
        body: JSON.stringify({
          action: 'save-state',
          leagueId: CURRENT_LEAGUE.league.id,
          edits: [{ manager, slotIndex, field, value }],
          month: viewMonth,
        }),
      });
      const res = await r.json();
      if (inputEl) {
        inputEl.classList.remove('saving');
        if (res.ok) {
          inputEl.classList.add('saved');
          setTimeout(() => inputEl?.classList.remove('saved'), 1500);
        } else {
          toastErr(res.error || 'Save failed');
        }
      }
      if (res.ok) setSyncUI('live', '✓ Saved');
    } catch(e) {
      if (inputEl) inputEl.classList.remove('saving');
      toastErr('Save failed: ' + e.message);
    }
  }, 400);
}

    const res = await r.json();

// ── DRAFT ROOM ──
// State lives in _draft (fetched from server), _draftFilter, _draftSort,
// _draftRosterMgr (which manager's roster is shown in the right panel).
let _draft = null;
let _draftFilter = { pos: 'ALL', team: 'ALL', health: 'ALL', search: '' };
let _draftSort = 'hr'; // 'hr' | 'prevHR' | 'name'
let _draftRosterMgr = null;

// ── DRAFT QUEUE ──
// Per-league queue stored in localStorage — personal to each manager's device.
// Auto-purges drafted players on every render.
let _draftQueue = [];
let _rosterViewMgr = null;   // persists across re-renders
let _rosterViewMonth = null; // persists across re-renders
let _scoreboardViewMonth = null; // persists across re-renders

function loadDraftQueue(leagueId) {
  try {
    const raw = localStorage.getItem(`draftQueue:${leagueId}`);
    _draftQueue = raw ? JSON.parse(raw) : [];
  } catch { _draftQueue = []; }
}

function saveDraftQueue(leagueId) {
  try {
    localStorage.setItem(`draftQueue:${leagueId}`, JSON.stringify(_draftQueue));
  } catch {}
}

function addToQueue(leagueId, idx) {
  const player = window._draftFilteredPool?.[idx];
  if (!player) return;
  if (_draftQueue.some(p => normName(p.name) === normName(player.name))) {
    removeFromQueue(leagueId, player.name);
    return; // toggle off if already in queue
  }
  _draftQueue.push({ name: player.name, team: player.team, pos: player.pos, hr: player.hr, id: player.id });
  saveDraftQueue(leagueId);
  // Update just the queue panel without re-rendering the whole draft board
  renderQueuePanel();
  // Flash the row to confirm
  const btn = document.querySelector(`[data-queue-idx="${idx}"]`);
  if (btn) { btn.textContent = '✓Q'; btn.style.color = 'var(--green)'; }
}

function removeFromQueue(leagueId, playerName) {
  _draftQueue = _draftQueue.filter(p => normName(p.name) !== normName(playerName));
  saveDraftQueue(leagueId);
  renderQueuePanel();
}

function moveQueueItem(leagueId, idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= _draftQueue.length) return;
  const item = _draftQueue.splice(idx, 1)[0];
  _draftQueue.splice(newIdx, 0, item);
  saveDraftQueue(leagueId);
  renderQueuePanel();
}

function purgeQueueOfDraftedPlayers() {
  const pool = _draft?.pool || [];
  const draftedNames = new Set(pool.filter(p => p.drafted).map(p => normName(p.name)));
  _draftQueue = _draftQueue.filter(p => !draftedNames.has(normName(p.name)));
}

async function draftFromQueue(leagueId) {
  if (!_draftQueue.length) return;
  await makeDraftPick(leagueId, _draftQueue[0]);
}

function clearDraftQueue(leagueId) {
  _draftQueue = [];
  saveDraftQueue(leagueId);
  renderQueuePanel();
}
let _draftPollTimer = null;

// Looks up who drafted a given player name from the draft's picks array.
// Used to fill in draftedBy for the lightweight stateOnly responses, which
// don't re-send the full pool but do include draft.picks.
function findDraftedByName(draftResponse, playerName) {
  const norm = normName(playerName);
  const pick = (draftResponse.draft?.picks || []).find(p => normName(p.player) === norm);
  return pick?.mgr || null;
}

async function renderDraft(body) {
  if (!SESSION) {
    body.innerHTML = `<div class="notice info">Sign in to access the draft room.</div>`;
    return;
  }
  body.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted)">Loading draft room…</div>`;
  // Reset cached pool when entering the draft tab fresh
  window._draftFullPool = null;
  // Load this manager's personal queue from localStorage
  loadDraftQueue(CURRENT_LEAGUE.league.id);
  await loadDraftState(body, { fullPool: true });
}

// Loads draft state from the server.
// fullPool=true (initial load): fetches the complete 400-player pool with
//   health/HR data — this is the slow call (~1-2s, several MLB API requests).
// fullPool=false (default, used by polling/post-pick refresh): lightweight
//   stateOnly fetch that only returns picks/turn-order/roster data — no MLB
//   API calls at all server-side, just reads from the league blob. This is
//   what makes taking a pick feel instant instead of laggy.
async function loadDraftState(body, { fullPool = false } = {}) {
  const leagueId = CURRENT_LEAGUE.league.id;
  try {
    const stateOnlyParam = fullPool ? '' : '&stateOnly=true';
    const r = await fetch(`${API_DRAFT}?leagueId=${encodeURIComponent(leagueId)}${stateOnlyParam}`, { headers: authHeaders(), cache: 'no-store' });
    const fresh = await r.json();
    if (!fresh.ok) throw new Error(fresh.error || 'Failed to load draft');

    if (fullPool && fresh.pool) {
      // Cache the full pool client-side — we won't re-fetch it on every poll
      window._draftFullPool = fresh.pool;
    }

    // Merge: use the cached full pool, but overlay fresh drafted/team-taken
    // status from this response so availability is always current even
    // though we're not re-fetching the whole pool every time.
    const basePool = window._draftFullPool || fresh.pool || [];
    const mergedPool = basePool.map(p => {
      const norm = normName(p.name);
      const isPlayerDrafted = !!fresh.draftStatusByName?.[norm];
      // Only treat a taken team as blocking when the league's team rule
      // actually enforces uniqueness — 'unrestricted' leagues allow the
      // same MLB team to appear on multiple rosters.
      const isTeamTaken = !!(fresh.takenTeams || []).includes(normTeamFE(p.team)) && fresh.teamRule === 'all-unique';
      const draftedBy = isPlayerDrafted
        ? null // will be filled below from picks if needed
        : isTeamTaken
          ? (fresh.draftedTeamToManager?.[normTeamFE(p.team)] || null)
          : null;
      return {
        ...p,
        drafted: isPlayerDrafted || isTeamTaken,
        draftedBy: isPlayerDrafted ? findDraftedByName(fresh, p.name) : draftedBy,
        teamTaken: isTeamTaken && !isPlayerDrafted,
      };
    });

    _draft = { ...fresh, pool: mergedPool };
    if (!_draftRosterMgr) _draftRosterMgr = _draft.me || CURRENT_LEAGUE.league.managers[0];
    renderDraftRoom(body || document.getElementById('tab-body'));
    startDraftPolling();
  } catch (e) {
    const el = body || document.getElementById('tab-body');
    if (el) el.innerHTML = `<div class="notice err">Couldn't load draft room: ${escapeHtml(e.message)}</div>`;
  }
}

function startDraftPolling() {
  if (_draftPollTimer) clearInterval(_draftPollTimer);
  if (!_draft?.draft || _draft.draft.status !== 'active') return;
  _draftPollTimer = setInterval(async () => {
    if (document.hidden || CURRENT_TAB !== 'draft') return;
    const leagueId = CURRENT_LEAGUE.league.id;
    try {
      // stateOnly=true skips the slow ~1-2s MLB pool fetch entirely — polling
      // only needs picks/turn-order, which is a single fast blob read.
      const r = await fetch(`${API_DRAFT}?leagueId=${encodeURIComponent(leagueId)}&stateOnly=true`, { headers: authHeaders(), cache: 'no-store' });
      const fresh = await r.json();
      if (!fresh.ok) return;
      const prevPickCount = _draft?.draft?.picks?.length || 0;
      const newPickCount  = fresh?.draft?.picks?.length  || 0;

      // Merge fresh drafted/team-taken status onto the already-cached full
      // pool — we never re-fetch the 400-player pool on poll, just overlay
      // current availability onto what we already have.
      const basePool = window._draftFullPool || _draft.pool || [];
      const mergedPool = basePool.map(p => {
        const norm = normName(p.name);
        const isPlayerDrafted = !!fresh.draftStatusByName?.[norm];
        // Only treat a taken team as blocking when the league's team rule
      // actually enforces uniqueness — 'unrestricted' leagues allow the
      // same MLB team to appear on multiple rosters.
      const isTeamTaken = !!(fresh.takenTeams || []).includes(normTeamFE(p.team)) && fresh.teamRule === 'all-unique';
        return {
          ...p,
          drafted: isPlayerDrafted || isTeamTaken,
          draftedBy: isPlayerDrafted ? findDraftedByName(fresh, p.name) : (isTeamTaken ? (fresh.draftedTeamToManager?.[normTeamFE(p.team)] || null) : null),
          teamTaken: isTeamTaken && !isPlayerDrafted,
        };
      });
      _draft = { ...fresh, pool: mergedPool };

      if (newPickCount !== prevPickCount) {
        // If the user is actively typing in search, skip this render entirely
        // and let the next poll (or their next keystroke) pick up fresh data.
        // Yanking the table away mid-search is worse than being 8s stale.
        const searchInput = document.getElementById('draft-search');
        if (document.activeElement === searchInput && searchInput.value) {
          return;
        }

        // Preserve the player pool's scroll position across the re-render —
        // without this, every new pick from any manager would yank the page
        // back to the top mid-browse, which is exactly what was happening.
        const poolContainer = document.getElementById('draft-pool-scroll-container');
        const savedScrollTop = poolContainer?.scrollTop || 0;

        renderDraftRoom(document.getElementById('tab-body'));

        requestAnimationFrame(() => {
          const newPoolContainer = document.getElementById('draft-pool-scroll-container');
          if (newPoolContainer) newPoolContainer.scrollTop = savedScrollTop;
        });
      }
    } catch {}
  }, 8000);
}

function renderDraftRoom(body) {
  if (!body) return;
  const d = _draft;
  const league = CURRENT_LEAGUE.league;
  const isCommish = CURRENT_LEAGUE.isCommish;
  const myMgr = d.me;

  // ── No draft open yet ──
  if (!d.draft) {
    const prev = (() => {
      const keys = Object.keys(league.months || {}).sort((a, b) => monthSortKey(a) - monthSortKey(b));
      return keys[keys.length - 1] || league.currentMonth;
    })();

    const lastDraftDate = league.draftClosedAt
      ? `Last draft completed ${new Date(league.draftClosedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}`
      : null;

    // Season-long totals — worst picks first
    const standings = (league.managers || []).map(m => ({
      mgr: m,
      hr: Object.keys(league.months || {}).reduce((s, k) => {
        return s + ((league.months[k]?.rosters[m]) || []).reduce((t, p) => t + (parseInt(p.hr) || 0), 0);
      }, 0),
    })).sort((a, b) => a.hr - b.hr); // worst first = picks first

    body.innerHTML = `
      <div style="max-width:700px">
        ${isCommish ? `
          ${lastDraftDate ? `<div style="margin-bottom:12px;font-size:12px;color:var(--text-muted)">📅 ${escapeHtml(lastDraftDate)}</div>` : ''}
          <div class="panel">
            <div class="panel-header">Open the Draft</div>
            <div class="panel-body">
              <div class="settings-row">
                <div class="field">
                  <label>Drafting for month</label>
                  <div style="display:flex;gap:8px">
                    <select class="select" id="draft-month-month">
                      ${['January','February','March','April','May','June','July','August','September','October','November','December']
                        .map(m => `<option value="${m}" ${league.currentMonth?.startsWith(m) ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                    <select class="select" id="draft-month-year" style="width:90px">
                      ${[2025,2026,2027].map(y => `<option value="${y}" ${league.currentMonth?.endsWith(String(y)) ? 'selected' : ''}>${y}</option>`).join('')}
                    </select>
                  </div>
                  <div class="input-help">This is the month managers are building their roster for. HR tracking begins when the draft closes.</div>
                </div>
                <div class="field">
                  <label>Draft type</label>
                  <select class="select" id="draft-type">
                    <option value="straight" selected>Straight (1-2-3-4 repeating)</option>
                    <option value="snake">Snake (1-2-3-4-4-3-2-1)</option>
                  </select>
                </div>
              </div>
              <div class="settings-row">
                <div class="field">
                  <label>Rounds</label>
                  <input class="input" type="number" id="draft-rounds" min="1" max="30" value="${league.settings?.rosterSize || 6}">
                  <div class="input-help">Defaults to roster size (${league.settings?.rosterSize || 6})</div>
                </div>
              </div>
              <div class="field">
                <label>Draft order ${standings.every(s => s.hr === 0) ? '(randomized — new league, no season stats yet)' : '(worst season HR → best picks first)'}</label>
                <div id="draft-order-list" style="background:rgba(0,0,0,0.25);border:1px solid var(--panel-border);border-radius:6px;padding:8px;margin-top:4px">
                  ${standings.map((s, i) => `
                    <div class="draft-order-row" data-mgr="${escapeAttr(s.mgr)}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:${i < standings.length - 1 ? '1px dashed var(--panel-border)' : 'none'}">
                      <span style="font-family:'Roboto Mono',monospace;font-size:12px;color:var(--accent);width:24px">${i + 1}.</span>
                      <span style="flex:1;font-weight:600">${escapeHtml(s.mgr)}</span>
                      <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:var(--text-muted)">${s.hr} HR season total</span>
                      <div style="display:flex;gap:4px">
                        <button class="btn btn-sm btn-ghost" style="padding:2px 8px" onclick="moveDraftOrder(${i}, -1)">↑</button>

                </div>
                <div class="input-help">Drag or use arrows to adjust. Commissioner can override the auto order.</div>
              </div>
              <div class="error" id="open-draft-err"></div>
              <button class="btn btn-primary" onclick="submitOpenDraft('${escapeAttr(league.id)}')">Open draft</button>
            </div>
          </div>
        ` : `
          ${lastDraftDate ? `<div style="margin-bottom:12px;font-size:12px;color:var(--text-muted)">📅 ${escapeHtml(lastDraftDate)}</div>` : ''}

            <div class="empty-state-title">Draft not open yet</div>
            <div class="empty-state-body">The commissioner hasn't opened the draft for next month. Check back soon.</div>

    `;
    return;
  }

  // ── Draft complete ──
  if (d.draft.status === 'complete') {
    const lastDraftDate = league.draftClosedAt
      ? new Date(league.draftClosedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })

    const draftedMonthIsUpcoming = d.draft.month !== league.currentMonth && monthSortKey(d.draft.month) > monthSortKey(league.currentMonth);

        ${lastDraftDate ? `<span style="font-size:12px;color:var(--text-muted);margin-left:12px">Completed ${escapeHtml(lastDraftDate)}</span>` : ''}
        ${isCommish ? `<button class="btn btn-sm btn-ghost" style="margin-left:12px" onclick="resetDraft('${escapeAttr(league.id)}')">Reset draft</button>` : ''}
        ${draftedMonthIsUpcoming ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px">📅 ${escapeHtml(league.currentMonth)} is still active — these rosters go live automatically on ${escapeHtml(d.draft.month.split('-')[0])} 1.</div>` : ''}

    return;
  }

  // ── Active draft ──
  const picks = d.draft.picks || [];
  const onClock = d.onClock;
  const isMyTurn = myMgr === onClock || isCommish;
  const totalPicks = d.draft.fullOrder?.length || (d.draft.order.length * d.draft.rounds);
  const pctDone = Math.round((picks.length / totalPicks) * 100);

  // Build position fill state for the roster panel
  const rosterSlots = _draft.rosterViews?.[_draftRosterMgr] || [];
  const filledPositions = rosterSlots.filter(Boolean).map(p => p.pos);

                <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">

          </div>
        </div>
      </div>

      <!-- CENTER: Draft board (primary focus) -->
      <div>
        <!-- On-clock banner -->
        <div style="background:${onClock === myMgr ? 'rgba(240,199,94,0.12)' : 'rgba(13,22,41,0.85)'};border:1px solid ${onClock === myMgr ? 'rgba(240,199,94,0.4)' : 'var(--panel-border)'};border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div>
            <div style="font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px">On the clock · Round ${d.round} · Pick ${d.pickNumber} of ${totalPicks}</div>
            <div style="font-size:18px;font-weight:700;color:${onClock === myMgr ? 'var(--accent)' : 'var(--text)'}">
              ${onClock === myMgr ? '⭐ Your pick!' : `${escapeHtml(onClock)}'s pick`}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div style="font-family:'Roboto Mono',monospace;font-size:12px;color:var(--text-muted)">${pctDone}% done</div>
            ${isCommish && picks.length > 0 ? `<button class="btn btn-sm btn-ghost" onclick="undoLastDraftPick('${escapeAttr(league.id)}')" title="Reverses ${escapeAttr(picks[picks.length-1]?.player || '')}, ${escapeAttr(picks[picks.length-1]?.mgr || '')}'s last pick">↩ Undo last pick</button>` : ''}
            ${isCommish && onClock !== myMgr ? `<button class="btn btn-sm btn-ghost" onclick="skipDraftPick('${escapeAttr(league.id)}')">Skip ${escapeHtml(onClock)}</button>` : ''}
            ${isCommish ? `<button class="btn btn-sm btn-danger" onclick="resetDraft('${escapeAttr(league.id)}')">Close draft</button>` : ''}
          </div>
        </div>

        <!-- Filters -->
        <div style="background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:2;min-width:160px">
            <input class="input compact" id="draft-search" placeholder="Search player…" value="${escapeAttr(_draftFilter.search)}" oninput="setDraftFilter('search', this.value)" style="width:100%">
          </div>
          <div>
            <select class="select" style="padding:6px 8px;font-size:12px" onchange="setDraftFilter('pos', this.value)">
              ${['ALL','C','1B','2B','3B','SS','OF','RF','CF','LF','DH','SP','RP'].map(p =>
                `<option value="${p}" ${_draftFilter.pos === p ? 'selected' : ''}>${p === 'ALL' ? 'All Pos' : p}</option>`
              ).join('')}
            </select>
          </div>
          <div>
            <select class="select" style="padding:6px 8px;font-size:12px" onchange="setDraftFilter('team', this.value)">
              <option value="ALL">All Teams</option>
              ${['ATH','ATL','AZ','BAL','BOS','CHC','CIN','CLE','COL','CWS','DET','HOU','KC','LAA','LAD','MIA','MIL','MIN','NYM','NYY','PHI','PIT','SD','SEA','SF','STL','TB','TEX','TOR','WSH'].map(t => {
                const taken = (_draft?.takenTeams || []).includes(normTeamFE(t));
                return `<option value="${t}" ${_draftFilter.team === t ? 'selected' : ''} ${taken ? 'disabled' : ''} style="${taken ? 'text-decoration:line-through;color:#6b7280;' : ''}">${taken ? '✕ ' : ''}${t}</option>`;
              }).join('')}
            </select>
          </div>
          <div>
            <select class="select" style="padding:6px 8px;font-size:12px" onchange="setDraftFilter('health', this.value)">
              <option value="ALL" ${_draftFilter.health === 'ALL' ? 'selected' : ''}>All Health</option>
              <option value="Active" ${_draftFilter.health === 'Active' ? 'selected' : ''}>Healthy only</option>
              <option value="IL" ${_draftFilter.health === 'IL' ? 'selected' : ''}>IL</option>
              <option value="OTHER" ${_draftFilter.health === 'OTHER' ? 'selected' : ''}>Other (restricted/suspended/etc.)</option>
            </select>
          </div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm ${_draftSort === 'hr' ? 'btn-primary' : 'btn-ghost'}" onclick="setDraftSort('hr')">Season HR</button>
            <button class="btn btn-sm ${_draftSort === 'prevHR' ? 'btn-primary' : 'btn-ghost'}" onclick="setDraftSort('prevHR')">${escapeHtml(d.draft.basedOn?.split('-')[0] || 'Prev')} HR</button>
            <button class="btn btn-sm ${_draftSort === 'name' ? 'btn-primary' : 'btn-ghost'}" onclick="setDraftSort('name')">A–Z</button>
          </div>
        </div>

        <!-- Player pool table -->
        <div class="panel">
          <div class="panel-body" id="draft-pool-scroll-container" style="padding:0;max-height:calc(100vh - 280px);overflow-y:auto">
            <table class="data-table" style="table-layout:fixed;width:100%">
              <thead style="position:sticky;top:0;z-index:2;background:var(--panel-solid)">
                <tr>
                  <th style="width:22px">#</th>
                  <th>Player</th>
                  <th class="right" style="width:40px">Ssn</th>
                  <th class="right" style="width:34px">${escapeHtml((d.draft?.basedOn || 'Prev').split('-')[0])}</th>
                  <th style="width:44px">Hlth</th>
                  <th style="width:68px"></th>
                </tr>
              </thead>
              <tbody id="draft-pool-body">
                ${renderDraftPool(d.pool || [], isMyTurn, onClock, league.id)}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- RIGHT: Roster panel -->
      <div style="position:sticky;top:80px">
        <div class="panel" style="margin:0">
          <div class="panel-header" style="flex-direction:column;gap:8px;align-items:flex-start">
            <span>Roster</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              ${(league.managers || []).map(m => `
                <button class="btn btn-sm ${_draftRosterMgr === m ? 'btn-primary' : 'btn-ghost'}" style="font-size:11px;padding:3px 8px" onclick="setDraftRosterMgr('${escapeAttr(m)}')">
                  ${escapeHtml(m)}${m === myMgr ? ' ★' : ''}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="panel-body" style="padding:10px;max-height:calc(100vh - 200px);overflow-y:auto">
            ${renderRosterPanel(rosterSlots, rounds, filledPositions, league.settings)}
          </div>
        </div>
      </div>
    </div>

    <style>
      @media (max-width: 1024px) {
        #draft-grid { grid-template-columns: 1fr 280px !important; }
        #draft-grid > div:first-child { display: none; } /* hide recent picks column on tablet, board+roster only */
      }
      @media (max-width: 760px) {
        #draft-grid { grid-template-columns: 1fr !important; }
        #draft-grid > div:first-child { display: block !important; order: 3; } /* recent picks moves below board on mobile */
        #draft-grid > div:nth-child(3) { order: 2; } /* roster after board on mobile */
        #draft-grid > div:nth-child(2) { order: 1; } /* board first on mobile */
      }
    </style>
  `;
  // Populate the queue panel after the DOM is set
  requestAnimationFrame(() => renderQueuePanel());
}

function renderDraftPool(pool, isMyTurn, onClock, leagueId) {
  const search = _draftFilter.search.toLowerCase();

  // Get current manager's position counts for the "on clock" manager
  const onClockPosCounts = _draft?.mgrPosCounts?.[onClock] || {};

  // Position rule check, computed once here so both the filter and the row
  // renderer below use the same values. Applies to whoever is ON THE CLOCK,
  // not the viewer — everyone sees the same "actually pickable right now"
  // pool, whether it's your turn or you're watching someone else draft.
  //   all-unique            → max 1 of any position
  //   one-duplicate-allowed → max 2 of any position
  //   unrestricted          → no limit, never blocked
  const positionRule = _draft?.positionRule || 'one-duplicate-allowed';
  const maxAllowed = positionRule === 'all-unique' ? 1
    : positionRule === 'unrestricted' ? Infinity
    : 2; // one-duplicate-allowed
  const isPosBlocked = p => p.pos !== '?' && (onClockPosCounts[p.pos] || 0) >= maxAllowed;

  let filtered = pool.filter(p => {
    // Hide drafted/team-taken (already respects teamRule — see loadDraftState)
    // and position-ineligible players entirely, per the commissioner's rules.
    if (p.drafted) return false;
    if (isPosBlocked(p)) return false;
    if (_draftFilter.pos !== 'ALL' && p.pos !== _draftFilter.pos) return false;
    if (_draftFilter.team !== 'ALL' && normTeamFE(p.team) !== normTeamFE(_draftFilter.team)) return false;
    if (_draftFilter.health === 'OTHER' && (p.health === 'Active' || p.health === 'IL')) return false;
    else if (_draftFilter.health !== 'ALL' && _draftFilter.health !== 'OTHER' && p.health !== _draftFilter.health) return false;
    if (search && !p.name.toLowerCase().includes(search)) return false;
    return true;
  });
  filtered = filtered.sort((a, b) => {
    if (_draftSort === 'name') return a.name.localeCompare(b.name);
    if (_draftSort === 'prevHR') return b.prevHR - a.prevHR;
    return b.hr - a.hr;
  });

  // Merge in live search results if we have any (appended after pool matches,
  // deduped by name so a player already in the pool isn't shown twice)
  if (search.length >= 2 && window._draftLiveSearchResults?.length) {
    const poolNames = new Set(filtered.map(p => normName(p.name)));
    const extra = window._draftLiveSearchResults.filter(p =>
      !poolNames.has(normName(p.name)) && !p.drafted && !isPosBlocked(p)
    );
    filtered = [...filtered, ...extra];
  }

  // Store filtered pool on window so onclick handlers can reference by index
  window._draftFilteredPool = filtered;

  // If local pool search is empty/sparse and we haven't searched live yet for
  // this query, trigger a live MLB search. This catches players outside the
  // top-400 pool (e.g. lower-power hitters like catchers).
  if (search.length >= 2 && filtered.length < 5 && window._draftLastLiveSearchQuery !== search) {
    window._draftLastLiveSearchQuery = search;
    triggerLiveDraftSearch(search);
  }

  if (!filtered.length) {
    return `<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-faint)">
      ${search.length >= 2 ? 'Searching MLB for more players…' : 'No players match your filters'}
    </td></tr>`;
  }

  return filtered.slice(0, 300).map((p, i) => {
    // Drafted/team-taken and position-ineligible players are already
    // excluded above — every row reaching here is genuinely pickable.
    const healthColor = p.health === 'Active' ? 'var(--green)' : p.health === 'IL' ? 'var(--red)' : 'var(--orange)';

    let actionCell;
    if (isMyTurn) {
      actionCell = `<button class="btn btn-sm btn-primary" style="padding:3px 10px;font-size:11px" onclick="makeDraftPickByIndex(${i})">Draft</button>`;
    } else {
      actionCell = `<button class="btn btn-sm btn-ghost" style="padding:3px 10px;font-size:11px" disabled>Draft</button>`;
    }

    const leagueId = CURRENT_LEAGUE?.league?.id || '';
    const inQueue = _draftQueue.some(q => normName(q.name) === normName(p.name));
    const queueBtn = `<button data-queue-idx="${i}" class="btn btn-sm ${inQueue ? 'btn-primary' : 'btn-ghost'}" style="padding:3px 6px;font-size:10px" onclick="addToQueue('${escapeAttr(leagueId)}',${i})" title="${inQueue ? 'Remove from queue' : 'Add to queue'}">${inQueue ? '✓Q' : '+Q'}</button>`;

    return `<tr>
      <td style="font-family:'Roboto Mono',monospace;font-size:10px;color:var(--text-faint);width:22px">${p.rank || i + 1}</td>
      <td>
        <button data-player="${escapeAttr(p.name)}" data-mlbid="${p.id || ''}" onclick="openPlayerProfile(this.dataset.player, this.dataset.mlbid||null)"
          style="background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(255,255,255,0.2);display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px">
          ${escapeHtml(p.name)}
        </button>
        <div style="display:flex;gap:3px;margin-top:2px">
          <span class="team-chip" style="font-size:9px">${escapeHtml(p.team)}</span>
          <span class="pos-chip" style="font-size:9px">${escapeHtml(p.pos)}</span>
        </div>
      </td>
      <td class="right" style="font-family:'Roboto Mono',monospace;font-weight:600;font-size:13px">${p.hr}</td>
      <td class="right" style="font-family:'Roboto Mono',monospace;color:var(--text-muted);font-size:12px">${p.prevHR || '—'}</td>
      <td style="font-size:10px;color:${healthColor}">${escapeHtml(p.health)}</td>
      <td style="text-align:center">
        <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
          ${queueBtn}
          ${actionCell}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderRosterPanel(slots, rounds, filledPositions, settings) {
  // Get the viewing manager's position counts from server data
  const viewingMgr = _draftRosterMgr;
  const posCounts = _draft?.mgrPosCounts?.[viewingMgr] || {};
  const posAllowed = settings?.positionsAllowed || [];

  // All positions used in draft (from all managers) for reference
  const filledCount = slots.filter(Boolean).length;

  return `
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.06em;text-transform:uppercase">
      ${filledCount} / ${rounds} picks made
    </div>
    ${Array.from({ length: rounds }, (_, i) => {
      const slot = slots[i];
      if (slot && !slot.skipped) {
        return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--panel-border)">
          <span style="font-family:'Roboto Mono',monospace;font-size:10px;color:var(--text-faint);width:16px;flex-shrink:0">${i + 1}</span>
          <span class="pos-chip" style="font-size:9px;flex-shrink:0">${escapeHtml(slot.pos || '?')}</span>
          <span style="flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(slot.player)}</span>
          <span style="font-family:'Roboto Mono',monospace;font-size:9px;color:var(--text-faint);flex-shrink:0">${escapeHtml(slot.team || '')}</span>
        </div>`;
      }
      if (slot?.skipped) {
        return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--panel-border)">
          <span style="font-family:'Roboto Mono',monospace;font-size:10px;color:var(--text-faint);width:16px;flex-shrink:0">${i + 1}</span>
          <span style="font-size:11px;color:var(--text-faint);font-style:italic">— skipped —</span>
        </div>`;
      }
      return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--panel-border)">
        <span style="font-family:'Roboto Mono',monospace;font-size:10px;color:var(--text-faint);width:16px;flex-shrink:0">${i + 1}</span>
        <span style="font-size:12px;color:var(--text-faint);font-style:italic">— open —</span>
      </div>`;
    }).join('')}

    ${posAllowed.length ? `
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--panel-border)">
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Position tracker</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${posAllowed.map(pos => {
            const count = posCounts[pos] || 0;
            // Read the ACTUAL league position rule rather than assuming "max 2":
            //   all-unique            → max 1 of any position
            //   one-duplicate-allowed → max 2 of any position
            //   unrestricted          → no limit
            const posRule = settings?.positionRule || 'one-duplicate-allowed';
            const maxAllowed = posRule === 'all-unique' ? 1
              : posRule === 'unrestricted' ? Infinity
              : 2;
            const maxed  = count >= maxAllowed;
            const used   = count > 0 && !maxed;
            let bg, color, decoration;
            if (maxed) {
              bg = 'rgba(239,68,68,0.15)'; color = 'var(--red)'; decoration = 'line-through';
            } else if (used) {
              bg = 'rgba(251,146,60,0.15)'; color = 'var(--orange)'; decoration = 'none';
            } else {
              bg = 'rgba(255,255,255,0.06)'; color = 'var(--text-faint)'; decoration = 'none';
            }
            return `<span style="font-family:'Roboto Mono',monospace;font-size:9px;padding:3px 6px;border-radius:3px;
              background:${bg};color:${color};text-decoration:${decoration};
              display:inline-flex;align-items:center;gap:3px">
              ${escapeHtml(pos)}${count > 0 ? `<span style="font-size:8px;opacity:0.8">×${count}</span>` : ''}
            </span>`;
          }).join('')}
        </div>
        <div style="margin-top:6px;font-size:10px;color:var(--text-faint)">
          <span style="color:var(--text-faint)">□ unused</span>
          ${(settings?.positionRule || 'one-duplicate-allowed') !== 'all-unique'
            ? '<span style="color:var(--orange);margin-left:8px">used once</span>'
            : ''}
          <span style="color:var(--red);text-decoration:line-through;margin-left:8px">maxed — can't pick again</span>
        </div>
      </div>
    ` : ''}
  `;
}

// Draft order reordering (up/down arrows)
function moveDraftOrder(idx, dir) {
  const rows = [...document.querySelectorAll('.draft-order-row')];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= rows.length) return;
  const parent = rows[0].parentNode;
  // Swap the two rows by inserting each before the other
  if (dir === -1) {
    // Move row UP: insert current row before the one above it
    parent.insertBefore(rows[idx], rows[newIdx]);
  } else {
    // Move row DOWN: insert the row below before the current row,
    // which effectively moves the current row down one position
    parent.insertBefore(rows[newIdx], rows[idx]);
  }
  // Update onclick indices after the swap so arrows stay correct
  const updated = [...document.querySelectorAll('.draft-order-row')];
  updated.forEach((row, i) => {
    const btns = row.querySelectorAll('button');
    if (btns[0]) btns[0].setAttribute('onclick', `moveDraftOrder(${i}, -1)`);
    if (btns[1]) btns[1].setAttribute('onclick', `moveDraftOrder(${i}, 1)`);
  });
}

// Called by the Draft button — reads player from window._draftFilteredPool
// by index so we never have to serialize a player object into an onclick attribute.
// Fires a live MLB player search when the local pool doesn't have enough
// matches (e.g. searching for a lower-HR player like a catcher who isn't in
// the top-400 pool). Results get merged into the next render automatically.
let _draftSearchDebounce = null;
function triggerLiveDraftSearch(query) {
  clearTimeout(_draftSearchDebounce);
  _draftSearchDebounce = setTimeout(async () => {
    try {
      const leagueId = CURRENT_LEAGUE.league.id;
      const r = await fetch(`${API_DRAFT}?leagueId=${encodeURIComponent(leagueId)}&search=${encodeURIComponent(query)}`, {
        headers: authHeaders(), cache: 'no-store',
      });
      const res = await r.json();
      if (res.ok) {
        window._draftLiveSearchResults = res.results || [];
        // Only re-render if the search box still has this exact query
        const searchInput = document.getElementById('draft-search');
        if (searchInput && searchInput.value.toLowerCase() === query) {
          setDraftFilter('search', searchInput.value);
        }
      }
    } catch {}
  }, 400); // debounce so we don't fire on every keystroke
}

async function makeDraftPickByIndex(idx) {

  if (!player) {
    toastErr(`Player not found at index ${idx}. Pool size: ${window._draftFilteredPool?.length ?? 'undefined'}. Try refreshing.`);
    return;

    return;
