// Renders the notifications panel into any element by ID.
// Used by both the My Settings tab and the Commissioner tab.
async function renderNotificationsPanelInto(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    el.innerHTML = '<p class="input-help">This browser doesn\'t support push notifications.</p>';
    return;
  }
  if (!SESSION) {
    el.innerHTML = '<p class="input-help">Sign in to enable notifications.</p>';
    return;
  }
  let info;
  try {
    const r = await fetch(API_PUSH, { headers: authHeaders(), cache: 'no-store' });
    info = await r.json();
  } catch {
    el.innerHTML = '<p class="input-help">Couldn\'t load notification status.</p>';
    return;
  }
  if (!info.publicKey) {
    el.innerHTML = '<p class="input-help" style="color:var(--red)">Push notifications not configured on this server.</p>';
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration();
  const localSub = reg ? await reg.pushManager.getSubscription() : null;
  const subscribed = info.subscribed && !!localSub;

  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const iosHint = (iOS && !standalone)
    ? '<div class="notice warn" style="margin-bottom:12px">📱 On iPhone, add this site to your Home Screen first, then open from that icon and enable notifications here.</div>'
    : '';

  el.innerHTML = `
    ${iosHint}
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-family:'Roboto Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:${subscribed ? 'rgba(58,160,92,0.15)' : 'rgba(148,163,184,0.12)'};color:${subscribed ? 'var(--green)' : 'var(--text-muted)'}">
        ${subscribed ? '✓ NOTIFICATIONS ON' : 'OFF'}
      </span>
      <button class="btn btn-sm" onclick="${subscribed ? `disableNotificationsFor('${elementId}')` : `enableNotificationsFor('${elementId}')`}">
        ${subscribed ? 'Turn off on this device' : 'Enable on this device'}
      </button>
    </div>
    ${subscribed ? `
      <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;background:rgba(0,0,0,0.25);border-radius:6px;cursor:pointer">
        <input type="checkbox" id="notify-all-${elementId}" ${info.notifyAll ? 'checked' : ''} onchange="setNotifyAll(this.checked)" style="margin-top:3px;width:16px;height:16px;accent-color:var(--blue)">
        <div>
          <div style="font-weight:600;font-size:13px;color:var(--text);margin-bottom:3px">Notify me on every league HR</div>
          <div class="input-help">Your own players get a celebration 🚀. Others get a quick factual update. Quiet hours 11 PM – 9 AM PT apply to all notifications.</div>
        </div>
      </label>
    ` : `
      <p class="input-help">Each device subscribes separately. Enable on your phone AND your laptop if you want both.</p>
    `}
  `;
}

// Converts a URL-safe base64 VAPID public key to a Uint8Array for the
// PushManager.subscribe() call. Required by the Web Push API.
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function enableNotificationsFor(elementId) {
  try {
    const info = await (await fetch(API_PUSH, { headers: authHeaders() })).json();
    if (!info.publicKey) return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('Notifications were not allowed. Check your browser settings.'); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(info.publicKey),
    });
    await fetch(API_PUSH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'subscribe', subscription: sub.toJSON() }),
    });
    renderNotificationsPanelInto(elementId);
  } catch (e) {
    alert('Could not enable notifications: ' + e.message);
  }
}

async function disableNotificationsFor(elementId) {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) {
      await sub.unsubscribe();
      await fetch(API_PUSH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ action: 'unsubscribe', subscription: sub.toJSON() }),
      });
    }
    renderNotificationsPanelInto(elementId);
  } catch (e) {
    alert('Could not disable notifications: ' + e.message);
  }
}

  const { league, isCommish } = CURRENT_LEAGUE;
  const inviteFull = `${location.origin}/join/${league.inviteToken}`;
  const pending = (league.members || []).filter(m => m.status === 'pending');
  const active  = (league.members || []).filter(m => m.status === 'active');
  const s = league.settings || {};

  let html = '';

  if (isCommish) {
    html += `
      <div class="panel">
        <div class="panel-header">Invite link</div>
        <div class="panel-body">
          <p class="input-help">Anyone with this link can request to join. You approve each request below.</p>
          <div class="invite-box">
            <div class="invite-url">${escapeHtml(inviteFull)}</div>
            <button class="btn btn-sm" onclick="copyInvite('${escapeAttr(inviteFull)}')">📋 Copy link</button>
            <button class="btn btn-sm" onclick="regenInvite()" style="margin-left:6px">Regenerate</button>
          </div>
        </div>
      </div>
    `;
    if (pending.length) {
      html += `
        <div class="panel">
          <div class="panel-header">Pending requests <span style="color:var(--accent)">${pending.length}</span></div>
          <div class="panel-body">
            ${pending.map(p => `
              <div class="pending-row">
                <div class="pending-info">
                  <div class="pending-name">${escapeHtml(p.manager)}</div>
                  <div class="pending-email">${escapeHtml(p.email || '')}</div>
                </div>
                <div class="pending-actions">
                  <button class="btn btn-sm btn-primary" onclick="approveMember('${escapeAttr(p.email)}')">Approve</button>
                  <button class="btn btn-sm btn-danger" onclick="declineMember('${escapeAttr(p.email)}')">Decline</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
    html += `
      <div class="panel">
        <div class="panel-header">League rules</div>
        <div class="panel-body">
          <div class="settings-row">
            <div class="field">
              <label>Roster size (players per manager)</label>
              <input class="input compact" type="number" min="1" max="30" id="set-rosterSize" value="${s.rosterSize || 6}">
            </div>
            <div class="field">
              <label>Redraft cadence</label>
              <select class="select" id="set-redraftCadence">
                <option value="monthly" ${s.redraftCadence === 'monthly' ? 'selected' : ''}>Monthly redraft</option>
                <option value="weekly" ${s.redraftCadence === 'weekly' ? 'selected' : ''}>Weekly redraft</option>
                <option value="season" ${s.redraftCadence === 'season' ? 'selected' : ''}>Full season (no redraft)</option>
              </select>
            </div>
          </div>
          <div class="settings-row">
            <div class="field">
              <label>Position rule</label>
              <select class="select" id="set-positionRule">
                <option value="all-unique" ${s.positionRule === 'all-unique' ? 'selected' : ''}>All positions must be different</option>
                <option value="one-duplicate-allowed" ${s.positionRule === 'one-duplicate-allowed' ? 'selected' : ''}>One duplicate position allowed</option>
                <option value="unrestricted" ${s.positionRule === 'unrestricted' ? 'selected' : ''}>No restriction</option>
              </select>
            </div>
            <div class="field">
              <label>Team uniqueness</label>
              <select class="select" id="set-teamRule">
                <option value="all-unique" ${s.teamRule === 'all-unique' ? 'selected' : ''}>Every player league-wide from a different MLB team</option>
                <option value="unrestricted" ${s.teamRule === 'unrestricted' ? 'selected' : ''}>Same MLB team can appear multiple times</option>
              </select>
            </div>
          </div>
          <div class="settings-row">
            <div class="field">
              <label>Multi-player rule</label>
              <select class="select" id="set-multiPlayerPerTeam">
                <option value="false" ${!s.multiPlayerPerTeam ? 'selected' : ''}>One manager per MLB player (no doubles)</option>
                <option value="true" ${s.multiPlayerPerTeam ? 'selected' : ''}>Same player can be on multiple rosters</option>
              </select>
            </div>
            <div class="field">
              <label>Scoring categories</label>
              <select class="select" id="set-scoringCategories" multiple style="min-height:90px">
                <option value="hr" ${(s.scoringCategories || []).includes('hr') ? 'selected' : ''}>HR (home runs)</option>
                <option value="rbi" ${(s.scoringCategories || []).includes('rbi') ? 'selected' : ''}>RBI</option>
                <option value="r" ${(s.scoringCategories || []).includes('r') ? 'selected' : ''}>R (runs)</option>
                <option value="sb" ${(s.scoringCategories || []).includes('sb') ? 'selected' : ''}>SB (stolen bases)</option>
                <option value="avg" ${(s.scoringCategories || []).includes('avg') ? 'selected' : ''}>AVG</option>
              </select>
              <div class="input-help">Cmd/Ctrl-click to select multiple. Currently the sync only tracks HR — others coming soon.</div>
            </div>
          </div>
          <div class="error" id="settings-err"></div>
          <button class="btn btn-primary" onclick="saveSettings()">Save rules</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">Rename league</div>
        <div class="panel-body">
          <div class="field">
            <input class="input" id="rename-input" maxlength="60" value="${escapeAttr(league.name)}">
          </div>
          <button class="btn" onclick="renameLeague()">Save name</button>
        </div>
      </div>
    `;
  }

  html += `
    <div class="panel">
      <div class="panel-header">Members</div>
      <div class="panel-body">
        ${active.map(m => `
          <div class="pending-row">
            <div class="pending-info">
              <div class="pending-name">${escapeHtml(m.manager)} ${m.email && league.commissioner === m.email ? '<span class="league-card-status commish" style="margin-left:4px">Commissioner</span>' : ''}</div>
              ${isCommish ? `<div class="pending-email" style="display:flex;align-items:center;gap:8px">
                ${m.email
                  ? `<span style="font-family:'Roboto Mono',monospace;font-size:11px;color:var(--text-muted)">${escapeHtml(m.email)}</span>`
                  : `<span style="font-size:11px;color:var(--orange);font-style:italic">⚠ No account linked</span>`}
              </div>` : ''}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${isCommish && !m.email ? `<button class="btn btn-sm" onclick="openLinkMember('${escapeAttr(m.manager)}')">Link account</button>` : ''}
              ${isCommish && league.commissioner !== m.email ? `<button class="btn btn-sm btn-danger" onclick="removeMember('${escapeAttr(m.manager)}')">Remove</button>` : ''}
            </div>
          </div>
        `).join('')}
        ${isCommish ? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--panel-border)">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
              Link a member's email to their manager slot. They'll see the league as soon as they sign up (or immediately if they already have an account).
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
              <div class="field" style="margin:0;flex:1;min-width:120px">
                <label>Manager name</label>
                <select class="select" id="link-manager-select" style="padding:7px 10px;font-size:13px">
                  <option value="">— pick manager —</option>
                  ${active.filter(m => !m.email && league.commissioner !== m.email).map(m =>
                    `<option value="${escapeAttr(m.manager)}">${escapeHtml(m.manager)}</option>`
                  ).join('')}
                </select>
              </div>
              <div class="field" style="margin:0;flex:2;min-width:180px">
                <label>Their email address</label>
                <input class="input compact" id="link-member-email" type="email" placeholder="friend@email.com" autocapitalize="off" autocorrect="off">
              </div>
              <button class="btn btn-primary btn-sm" style="white-space:nowrap;padding:8px 14px" onclick="submitLinkMember()">Link account</button>
            </div>
            <div class="error" id="link-member-err" style="margin-top:6px"></div>
          </div>
        ` : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">Notifications (this device)</div>
      <div class="panel-body">
        <div id="notif-panel"><p class="input-help">Loading…</p></div>
      </div>
    </div>
  `;

  body.innerHTML = html;
  renderNotificationsPanelInto('notif-panel');
}

async function openLinkMember(manager) {
  // Pre-fill the select when clicking the "Link account" button on a specific row
  const sel = document.getElementById('link-manager-select');
  if (sel) sel.value = manager;
  document.getElementById('link-member-email')?.focus();
}

async function submitLinkMember() {
  const err     = document.getElementById('link-member-err');
  err.textContent = '';
  const manager = document.getElementById('link-manager-select').value.trim();
  const email   = document.getElementById('link-member-email').value.trim().toLowerCase();
  if (!manager) { err.textContent = 'Pick a manager from the list'; return; }
  if (!email.includes('@')) { err.textContent = 'Valid email required'; return; }
  const res = await leagueAction('link-member', { manager, email });
  if (res?.ok) {
    err.style.color = 'var(--green)';
    err.textContent = `✓ ${manager} is now linked to ${email}`;
    await refreshLeague();
    setTimeout(() => { if (err) { err.textContent = ''; err.style.color = ''; } }, 3000);
  } else {
    err.textContent = res?.error || 'Failed to link';
  }
}

async function approveMember(email) { await leagueAction('approve', { email }); await refreshLeague(); }
async function declineMember(email) {
  if (!confirm('Decline this join request?')) return;
  await leagueAction('decline', { email }); await refreshLeague();
}
async function removeMember(manager) {
  if (!confirm(`Remove ${manager}? Past rosters stay; they won't appear going forward.`)) return;
  await leagueAction('remove', { manager }); await refreshLeague();
}
async function regenInvite() {
  if (!confirm('Regenerate the invite link? The current link will stop working.')) return;
  const res = await leagueAction('regenerate-invite', {});
  if (res?.ok) await refreshLeague();
}
async function renameLeague() {
  const name = document.getElementById('rename-input').value.trim();
  if (!name) return;
  const res = await leagueAction('rename', { name });
  if (res?.ok) await refreshLeague();
}
async function saveSettings() {
  const err = document.getElementById('settings-err');
  err.textContent = '';
  const settings = {
    rosterSize: parseInt(document.getElementById('set-rosterSize').value) || 6,
    redraftCadence: document.getElementById('set-redraftCadence').value,
    positionRule: document.getElementById('set-positionRule').value,
    teamRule: document.getElementById('set-teamRule').value,
    multiPlayerPerTeam: document.getElementById('set-multiPlayerPerTeam').value === 'true',
    scoringCategories: [...document.getElementById('set-scoringCategories').selectedOptions].map(o => o.value),
  };
  const res = await leagueAction('settings', { settings });
  if (res?.ok) {
    await refreshLeague();
    err.style.color = 'var(--green)';
    err.textContent = '✓ Saved';
    setTimeout(() => { err.textContent = ''; err.style.color = ''; }, 2000);
  } else {
    err.textContent = res?.error || 'Failed to save';
  }
}

async function leagueAction(action, payload) {
  try {
    const r = await fetch(API_LEAGUE, {
      method: 'POST',
      headers: {'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ action, leagueId: CURRENT_LEAGUE.league.id, ...payload }),
    });
    const res = await r.json();
    if (!res.ok) alert(res.error || 'Action failed');
    return res;
  } catch (e) {
    alert('Connection failed');
    return null;
  }
}

async function setNotifyAll(value) {
  try {
    await fetch(API_PUSH, {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({action:'set-prefs', notifyAll: value}),
    });
  } catch { renderNotificationsPanel(); }
}

async function syncCurrentLeague() {
  if (!CURRENT_LEAGUE) return;
  setSyncUI('loading', 'Syncing…');
  try {
    const r = await fetch(API_SYNC + '?leagueId=' + encodeURIComponent(CURRENT_LEAGUE.league.id), {
      method: 'POST',
      headers: authHeaders(),
    });
    const res = await r.json();
    if (!res.ok && res.error) { setSyncUI('err', res.error); return; }
    await refreshLeague();
    if (res.added > 0) setSyncUI('live', `+${res.added} new HR!`);
  } catch (e) {
    setSyncUI('err', 'Sync failed');
  }
}

function render404() {
  document.getElementById('view').innerHTML = `
    <div class="auth-shell">
      <div class="auth-panel">
        <div class="auth-title">Not found</div>
        <p class="auth-sub">That page doesn't exist.</p>
        <button class="btn btn-primary" style="width:100%" onclick="navigate('/')">Go home</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function normName(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim(); }
function ordinal(n) { const s = ['th','st','nd','rd']; const v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

(async function init() {
  renderAccountChip();

  // Register service worker and check for updates on every load.
  // This is what makes iOS PWA pick up new versions — without an explicit
  // update() call, iOS can cache the old SW for days.
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      // Force update check — critical for iOS PWA to detect new versions
      reg.update().catch(() => {});
    } catch (e) {
      console.log('SW registration failed:', e);
    }
  }

  if (SESSION) {
    try {
      const r = await fetch(API_AUTH, { headers: authHeaders(), cache: 'no-store' });
      const info = await r.json();
      if (!info.me) setSession(null);
      else if (info.me.isAdmin !== SESSION.isAdmin) setSession({ ...SESSION, isAdmin: info.me.isAdmin });
    } catch {}
  }
  await renderRoute();
})();
</script>
