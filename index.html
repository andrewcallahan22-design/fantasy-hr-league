}

async function makeDraftPick(leagueId, player) {
  // ── OPTIMISTIC UPDATE ──
  // Mark the player as drafted and advance the turn immediately in the
  // local _draft state so the UI responds instantly. If the server rejects
  // the pick, we roll back and show the error. This eliminates the visible
  // lag between tapping "Draft" and seeing the board update.
  const prevDraft = JSON.parse(JSON.stringify(_draft)); // snapshot for rollback
  const onClock = _draft.onClock;

  if (_draft.draft && onClock) {
    // Add pick optimistically
    _draft.draft.picks = _draft.draft.picks || [];
    _draft.draft.picks.push({
      mgr: onClock, player: player.name, team: player.team,
      pos: player.pos || '?', hr: player.hr || 0, mlbId: player.id, t: Date.now(),
    });
    // Mark player as drafted in pool
    if (_draft.pool) {
      _draft.pool = _draft.pool.map(p =>
        normName(p.name) === normName(player.name)
          ? { ...p, drafted: true, draftedBy: onClock }
          : normTeamFE(p.team) === normTeamFE(player.team) && !p.drafted
            ? { ...p, drafted: true, draftedBy: onClock, teamTaken: true }
            : p
      );
    }
    // Update pool cache too
    if (window._draftFullPool) {
      window._draftFullPool = window._draftFullPool.map(p =>
        normName(p.name) === normName(player.name)
          ? { ...p, drafted: true, draftedBy: onClock }
          : normTeamFE(p.team) === normTeamFE(player.team) && !p.drafted
            ? { ...p, drafted: true, draftedBy: onClock, teamTaken: true }
            : p
      );
    }
    // Advance the turn
    const pickIdx = _draft.draft.picks.length;
    const fullOrder = _draft.draft.fullOrder || [];
    _draft.onClock = fullOrder[pickIdx] || null;
    _draft.round = Math.floor(pickIdx / (_draft.draft.order?.length || 1)) + 1;
    _draft.pickNumber = pickIdx + 1;
    // Update position counts for the manager who just picked
    if (!_draft.mgrPosCounts) _draft.mgrPosCounts = {};
    if (!_draft.mgrPosCounts[onClock]) _draft.mgrPosCounts[onClock] = {};
    const pos = player.pos || '?';
    if (pos !== '?') _draft.mgrPosCounts[onClock][pos] = (_draft.mgrPosCounts[onClock][pos] || 0) + 1;
    // Update roster view
    if (!_draft.rosterViews) _draft.rosterViews = {};
    if (!_draft.rosterViews[onClock]) _draft.rosterViews[onClock] = [];
    _draft.rosterViews[onClock].push({ mgr: onClock, player: player.name, team: player.team, pos, hr: player.hr || 0 });
    // Re-render immediately with optimistic state
    const poolContainer = document.getElementById('draft-pool-scroll-container');
    const savedScroll = poolContainer?.scrollTop || 0;
    renderDraftRoom(document.getElementById('tab-body'));
    requestAnimationFrame(() => {
      const newContainer = document.getElementById('draft-pool-scroll-container');
      if (newContainer) newContainer.scrollTop = savedScroll;
    });
  }

  // ── SERVER CONFIRM ──
  // Send to server in background. If rejected, roll back.
  try {
    const r = await fetch(API_DRAFT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'pick', leagueId, pick: { player: player.name, team: player.team, pos: player.pos, hr: player.hr, mlbId: player.id } }),
    });
    const res = await r.json();
    if (!res.ok) {
      // Roll back optimistic update and restore scroll
      const poolContainer = document.getElementById('draft-pool-scroll-container');
      const savedScroll = poolContainer?.scrollTop || 0;
      _draft = prevDraft;
      renderDraftRoom(document.getElementById('tab-body'));
      requestAnimationFrame(() => {
        const c = document.getElementById('draft-pool-scroll-container');
        if (c) c.scrollTop = savedScroll;
      });
      toastErr(res.error || 'Pick failed');
      return;
    }
    // Server confirmed pick. The optimistic render already shows the correct
    // state, so we DON'T re-render — that's what was causing the scroll reset.
    // Instead do a silent background state sync so polling has fresh server data,
    // but only update _draft in memory without touching the DOM at all.
    silentDraftStateSync(leagueId);
  } catch (e) {
    const poolContainer = document.getElementById('draft-pool-scroll-container');
    const savedScroll = poolContainer?.scrollTop || 0;
    _draft = prevDraft;
    renderDraftRoom(document.getElementById('tab-body'));
    requestAnimationFrame(() => {
      const c = document.getElementById('draft-pool-scroll-container');
      if (c) c.scrollTop = savedScroll;
    });
    toastErr('Connection failed — try again');
  }
}

// Syncs draft state from server without touching the DOM.
// Used after optimistic picks to keep _draft in sync with server truth
// without causing any visible re-render or scroll position loss.
async function silentDraftStateSync(leagueId) {
  try {
    const r = await fetch(`${API_DRAFT}?leagueId=${encodeURIComponent(leagueId)}&stateOnly=true`, {
      headers: authHeaders(), cache: 'no-store',
    });
    const fresh = await r.json();
    if (!fresh.ok) return;
    // Merge server state into _draft without triggering any render
    const basePool = window._draftFullPool || _draft.pool || [];
    const mergedPool = basePool.map(p => {
      const norm = normName(p.name);
      const isPlayerDrafted = !!fresh.draftStatusByName?.[norm];
      // Only treat a taken team as blocking when the league's team rule
      // actually enforces uniqueness — 'unrestricted' leagues allow the
      // same MLB team to appear on multiple rosters.
      const isTeamTaken = !!(fresh.takenTeams || []).includes(normTeamFE(p.team)) && fresh.teamRule === 'all-unique';
      return {
        ...p,
        drafted: isPlayerDrafted || isTeamTaken,
        draftedBy: isPlayerDrafted ? findDraftedByName(fresh, p.name)
          : isTeamTaken ? (fresh.draftedTeamToManager?.[normTeamFE(p.team)] || null) : null,
        teamTaken: isTeamTaken && !isPlayerDrafted,
      };
    });
    _draft = { ...fresh, pool: mergedPool };
  } catch {} // non-fatal — polling will catch up
}

async function undoLastDraftPick(leagueId) {
  const lastPick = _draft?.draft?.picks?.[_draft.draft.picks.length - 1];
  const confirmMsg = lastPick
    ? `Undo ${lastPick.mgr}'s pick of ${lastPick.player}? They'll need to pick again.`
    : 'Undo the last pick?';
  if (!await confirmDialog(confirmMsg)) return;

  // Optimistic update
  const prevDraft = JSON.parse(JSON.stringify(_draft));
  if (_draft.draft?.picks?.length) {
    const removed = _draft.draft.picks.pop();
    // Un-draft the player in pool
    if (_draft.pool) _draft.pool = _draft.pool.map(p =>
      normName(p.name) === normName(removed.player) ? { ...p, drafted: false, draftedBy: null } : p
    );
    if (window._draftFullPool) window._draftFullPool = window._draftFullPool.map(p =>
      normName(p.name) === normName(removed.player) ? { ...p, drafted: false, draftedBy: null } : p
    );
    // Rewind turn
    const pickIdx = _draft.draft.picks.length;
    _draft.onClock = _draft.draft.fullOrder?.[pickIdx] || null;
    _draft.pickNumber = pickIdx + 1;
    renderDraftRoom(document.getElementById('tab-body'));
  }

  const r = await fetch(API_DRAFT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ action: 'undo', leagueId }),
  });
  const res = await r.json();
  if (!res.ok) { _draft = prevDraft; renderDraftRoom(document.getElementById('tab-body')); toastErr(res.error); return; }
  await loadDraftState(document.getElementById('tab-body'));
}

// Save rival message — either for this league only, or apply to all leagues
async function saveManagerName() {
  const err = document.getElementById('manager-name-err');
  err.textContent = ''; err.style.color = '';
  const newName = document.getElementById('manager-name-input')?.value.trim();
  if (!newName) { err.textContent = 'Team name cannot be empty'; return; }
  const leagueId = CURRENT_LEAGUE?.league?.id;
  if (!leagueId) return;

  try {
    const r = await fetch(API_LEAGUE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({
        action: 'rename-manager',
        leagueId,
        newName,
        currentManagerName: CURRENT_LEAGUE.myManager || '',
      }),
    });
    const res = await r.json();
    if (!res.ok) { err.textContent = res.error || 'Failed to save'; return; }

    // Update CURRENT_LEAGUE in memory so the rest of the UI reflects
    // the new name immediately without a full page reload
    const oldName = CURRENT_LEAGUE.myManager;
    CURRENT_LEAGUE.myManager = res.manager;

    // Update member record in memory
    const myMember = (CURRENT_LEAGUE.league.members || []).find(m =>
      m.email?.toLowerCase() === SESSION.email?.toLowerCase() ||
      m.manager === oldName
    );
    if (myMember) myMember.manager = res.manager;

    // Update managers array in memory
    const idx = (CURRENT_LEAGUE.league.managers || []).indexOf(oldName);
    if (idx !== -1) CURRENT_LEAGUE.league.managers[idx] = res.manager;

    // Update month roster keys in memory
    for (const monthKey of Object.keys(CURRENT_LEAGUE.league.months || {})) {
      const rosters = CURRENT_LEAGUE.league.months[monthKey].rosters;
      if (rosters?.[oldName] !== undefined) {
        rosters[res.manager] = rosters[oldName];
        delete rosters[oldName];
      }
    }

    err.style.color = 'var(--green)';
    err.style.fontWeight = '600';
    err.textContent = `✓ Team name updated to "${res.manager}"`;
    setTimeout(() => { err.textContent = ''; err.style.color = ''; err.style.fontWeight = ''; }, 3000);
  } catch (e) {
    err.textContent = 'Connection failed';
  }
}

async function saveRivalMessage(applyToAll) {
  const err = document.getElementById('rival-msg-err');
  if (err) { err.textContent = ''; err.style.color = ''; }
  const msg = document.getElementById('rival-message-input')?.value.trim() || '';
  const leagueId = CURRENT_LEAGUE?.league?.id;
  if (!leagueId) return;

  try {
    const r = await fetch(API_LEAGUE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'set-rival-message', leagueId, rivalMessage: msg, applyToAll }),
    });
    const res = await r.json();
    if (!res.ok) { if (err) err.textContent = res.error || 'Failed to save'; return; }

    // Update session account-level if applying to all
    if (applyToAll) setSession({ ...SESSION, rivalMessage: msg });

    // Update local league member record in memory.
    // Match by email first, then fall back to manager name since non-commissioners
    // don't get email fields returned on other members' records.
    const myMgr = CURRENT_LEAGUE.myManager;
    const myMember = (CURRENT_LEAGUE.league.members || []).find(m =>
      (m.email?.toLowerCase() === SESSION.email?.toLowerCase()) ||
      (m.manager === myMgr)
    );
    if (myMember) myMember.rivalMessage = msg;

    // Show confirmation without re-rendering the whole page
    // (re-rendering wipes the input field since the member record lookup
    // was failing silently and showing the old stale value)
    if (err) {
      err.style.color = 'var(--green)';
      err.style.fontWeight = '600';
      err.textContent = applyToAll ? '✓ Applied to all your leagues' : `✓ Saved for ${CURRENT_LEAGUE.league.name}`;
      setTimeout(() => { if (err) { err.textContent = ''; err.style.color = ''; err.style.fontWeight = ''; } }, 3000);
    }

    // Update just the status indicator without rebuilding the whole form
    const statusEl = document.getElementById('rival-override-status');
    if (statusEl && msg) {
      statusEl.style.color = 'var(--green)';
      statusEl.textContent = `✓ Custom message set for ${CURRENT_LEAGUE.league.name}`;
    }
  } catch (e) {
    if (err) err.textContent = 'Connection failed';
  }
}

// Clear the league-specific override, reverting to account default
async function clearLeagueRivalMessage() {
  const err = document.getElementById('rival-msg-err');
  if (err) { err.textContent = ''; err.style.color = ''; }
  const leagueId = CURRENT_LEAGUE?.league?.id;
  if (!leagueId) return;

  try {
    const r = await fetch(API_LEAGUE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'set-rival-message', leagueId, rivalMessage: null }),
    });
    const res = await r.json();
    if (!res.ok) { if (err) err.textContent = res.error || 'Failed'; return; }

    const myMgr = CURRENT_LEAGUE.myManager;
    const myMember = (CURRENT_LEAGUE.league.members || []).find(m =>
      (m.email?.toLowerCase() === SESSION.email?.toLowerCase()) ||
      (m.manager === myMgr)
    );
    if (myMember) delete myMember.rivalMessage;

    // Update the input to show account default, update status inline
    const input = document.getElementById('rival-message-input');
    if (input) input.value = SESSION.rivalMessage || '';
    const statusEl = document.getElementById('rival-override-status');
    if (statusEl) {
      statusEl.style.color = 'var(--text-muted)';
      statusEl.textContent = SESSION.rivalMessage
        ? 'Using your default message — you can set a custom one for this league below'
        : '';
    }
    updateRivalPreview(SESSION.rivalMessage || '');
  } catch (e) {
    if (err) err.textContent = 'Connection failed';
  }
}

// Live preview of rival notification message
function updateRivalPreview(template) {
  const preview = document.getElementById('rival-preview');
  if (!preview) return;
  const playerName  = 'Aaron Judge';
  const managerName = CURRENT_LEAGUE?.myManager || SESSION?.displayName || 'Your Team';
  const msg = (template || '💣 Tell your friends they\'re losing')
    .replace(/\{player\}/gi, playerName)
    .replace(/\{manager\}/gi, managerName)
    .slice(0, 120);
  // Body format: "PlayerName — custom message"
  preview.textContent = `${playerName} — ${msg}`;
}

// Save display name, photo URL, and HR emoji in one call
async function saveProfile() {
  const err = document.getElementById('profile-err');
  err.textContent = '';
  err.style.color = '';

  const displayName  = document.getElementById('display-name-input')?.value.trim();
  const photoUrl     = document.getElementById('profile-photo-url')?.value.trim();
  const hrEmoji      = document.getElementById('hr-emoji-input')?.value.trim();

  if (displayName !== undefined && !displayName) {
    err.textContent = 'Display name cannot be empty'; return;
  }

  try {
    const r = await fetch(API_AUTH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'update-profile', displayName, photoUrl, hrEmoji }),
    });
    const res = await r.json();
    if (!res.ok) { err.textContent = res.error || 'Failed to save'; return; }

    // Update session in memory
    setSession({
      ...SESSION,
      displayName:  res.displayName  !== undefined ? res.displayName  : SESSION.displayName,
      photoUrl:     res.photoUrl     !== undefined ? res.photoUrl     : SESSION.photoUrl,
      hrEmoji:      res.hrEmoji      !== undefined ? res.hrEmoji      : SESSION.hrEmoji,
      rivalMessage: res.rivalMessage !== undefined ? res.rivalMessage : SESSION.rivalMessage,
    });

    // Refresh the current league view so name changes show immediately
    // without requiring a manual page refresh
    if (CURRENT_LEAGUE) {
      renderLeagueShell();
    }

    err.style.color = 'var(--green)';
    err.style.fontWeight = '600';
    err.textContent = '✓ Profile saved';
    setTimeout(() => { err.textContent = ''; err.style.color = ''; err.style.fontWeight = ''; }, 3000);
  } catch (e) {
    err.textContent = 'Connection failed';
  }
}

async function submitChangePassword() {
  const err = document.getElementById('change-pw-err');
  err.textContent = '';
  const current = document.getElementById('change-pw-current').value;
  const newPw   = document.getElementById('change-pw-new').value;
  const confirm = document.getElementById('change-pw-confirm').value;
  if (!current)        { err.textContent = 'Current password required'; return; }
  if (newPw.length < 6){ err.textContent = 'New password must be at least 6 characters'; return; }
  if (newPw !== confirm){ err.textContent = 'Passwords don\'t match'; return; }
  try {
    const r = await fetch(API_AUTH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'change-password', currentPassword: current, newPassword: newPw }),
    });
    const res = await r.json();
    if (!res.ok) { err.textContent = res.error || 'Failed to update'; return; }
    document.getElementById('change-pw-modal').remove();
    toastErr('Password updated successfully.');
  } catch (e) {
    err.textContent = 'Connection failed';
  }
}

// Renders the notifications panel into any element by ID.
// Used by both the My Settings tab and the Commissioner tab.
async function renderNotificationsPanelInto(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    el.innerHTML = '<p class="input-help">This browser doesn\'t support push notifications.</p>';
    return;
  }
  if (!SESSION) {
    el.innerHTML = '<p class="input-help">Sign in to enable notifications.</p>';
    return;
  }
  let info;
  try {
    const r = await fetch(API_PUSH, { headers: authHeaders(), cache: 'no-store' });
    info = await r.json();
  } catch {
    el.innerHTML = '<p class="input-help">Couldn\'t load notification status.</p>';
    return;
  }
  if (!info.publicKey) {
    el.innerHTML = '<p class="input-help" style="color:var(--red)">Push notifications not configured on this server.</p>';
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration();
  const localSub = reg ? await reg.pushManager.getSubscription() : null;
  const subscribed = info.subscribed && !!localSub;

  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const iosHint = (iOS && !standalone)
    ? '<div class="notice warn" style="margin-bottom:12px">📱 On iPhone, add this site to your Home Screen first, then open from that icon and enable notifications here.</div>'
    : '';

  el.innerHTML = `
    ${iosHint}
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-family:'Roboto Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;background:${subscribed ? 'rgba(58,160,92,0.15)' : 'rgba(148,163,184,0.12)'};color:${subscribed ? 'var(--green)' : 'var(--text-muted)'}">
        ${subscribed ? '✓ NOTIFICATIONS ON' : 'OFF'}
      </span>
      <button class="btn btn-sm" onclick="${subscribed ? `disableNotificationsFor('${elementId}')` : `enableNotificationsFor('${elementId}')`}">
        ${subscribed ? 'Turn off on this device' : 'Enable on this device'}
      </button>
    </div>
    ${subscribed ? `
      <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;background:rgba(0,0,0,0.25);border-radius:6px;cursor:pointer;margin-bottom:10px">

          <div class="input-help">Your own players get a celebration 🚀. Others get a quick factual update. Notifications fire any time — silence your phone if you need a break.</div>
        </div>
      </label>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-ghost" onclick="sendTestNotification('${elementId}')">🔔 Send 2 test notifications</button>
        <div id="test-notif-result-${elementId}" style="font-size:12px;color:var(--text-muted)"></div>

    ` : `

    `}
  `;
}

// Converts a URL-safe base64 VAPID public key to a Uint8Array for the
// PushManager.subscribe() call. Required by the Web Push API.
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function sendTestNotification(elementId) {
  const resultEl = document.getElementById(`test-notif-result-${elementId}`);
  if (resultEl) resultEl.textContent = 'Sending…';
  try {
    const r = await fetch(API_PUSH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'send-test' }),
    });
    const res = await r.json();
    if (!res.ok) {
      if (resultEl) { resultEl.textContent = '❌ ' + (res.error || 'Failed'); resultEl.style.color = 'var(--red)'; }
      return;
    }
    if (res.sent > 0) {
      if (resultEl) { resultEl.textContent = `✓ Sent ${res.sent} test notification(s) — check your phone for both formats!`; resultEl.style.color = 'var(--green)'; }
    } else {
      if (resultEl) { resultEl.textContent = `❌ 0 delivered (${res.dead} dead subscription(s) pruned — try disabling and re-enabling notifications)`; resultEl.style.color = 'var(--orange)'; }
    }
  } catch (e) {
    if (resultEl) { resultEl.textContent = 'Connection failed'; resultEl.style.color = 'var(--red)'; }
  }
}

async function enableNotificationsFor(elementId) {
  try {
    const info = await (await fetch(API_PUSH, { headers: authHeaders() })).json();
    if (!info.publicKey) return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toastErr('Notifications were not allowed. Check your browser settings.'); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(info.publicKey),
    });
    await fetch(API_PUSH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'subscribe', subscription: sub.toJSON() }),
    });
    renderNotificationsPanelInto(elementId);
  } catch (e) {
    toastErr('Could not enable notifications: ' + e.message);
  }
}

async function disableNotificationsFor(elementId) {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) {
      await sub.unsubscribe();
      await fetch(API_PUSH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ action: 'unsubscribe', subscription: sub.toJSON() }),
      });
    }
    renderNotificationsPanelInto(elementId);
  } catch (e) {
    toastErr('Could not disable notifications: ' + e.message);
  }
}

          </div>
        ` : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">Notifications (this device)</div>
      <div class="panel-body">
        <div id="notif-panel"><p class="input-help">Loading…</p></div>
      </div>
    </div>
  `;

  body.innerHTML = html;
  renderNotificationsPanelInto('notif-panel');
  // Wire up dirty tracking so save button enables only when something changes
  requestAnimationFrame(() => initSettingsDirtyTracking());

  // Fetch fresh league data when the commissioner tab opens so pending
  // join requests appear immediately. Only re-renders if something actually
  // changed AND no form element is currently focused (protects open dropdowns).
  if (CURRENT_LEAGUE?.isCommish) {
    fetch(API_LEAGUE + '?id=' + encodeURIComponent(CURRENT_LEAGUE.league.id), {
      headers: authHeaders(), cache: 'no-store'
    }).then(r => r.json()).then(res => {
      if (!res.ok) return;
      if (CURRENT_TAB !== 'settings') return;

      // Check if anything actually changed worth re-rendering for
      const newPending  = (res.league?.members || []).filter(m => m.status === 'pending').length;
      const oldPending  = (CURRENT_LEAGUE.league?.members || []).filter(m => m.status === 'pending').length;
      if (newPending === oldPending) return; // nothing changed, don't re-render

      // Don't re-render if the user is actively interacting with a form element
      // (open dropdown, focused input, etc.) — this was closing their dropdowns
      const active = document.activeElement;
      if (active && (active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

      CURRENT_LEAGUE = res;
      renderActiveTab();
    }).catch(() => {});
  }
}

// Called once after renderSettings() builds the form.
// Watches all inputs/selects in the settings panel and re-enables the save
// button the moment any value changes, then greys it out again after saving.
function initSettingsDirtyTracking() {
  const btn = document.getElementById('settings-save-btn');
  if (!btn) return;

  // Capture initial snapshot of all settings values
  const ids = ['set-rosterSize','set-redraftCadence','set-positionRule','set-teamRule','set-multiPlayerPerTeam','set-scoringCategories','set-irSlots','set-irMode','set-irHrCarryover','set-irReplacementRule','set-waiverType'];
  const snapshot = {};
  for (const id of ids) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.multiple) snapshot[id] = [...el.selectedOptions].map(o => o.value).join(',');
    else snapshot[id] = el.value;
  }

  function enableSave() {
    // Check if anything actually changed from the snapshot
    let dirty = false;
    for (const id of ids) {
      const el = document.getElementById(id);
      if (!el) continue;
      const current = el.multiple ? [...el.selectedOptions].map(o => o.value).join(',') : el.value;
      if (current !== snapshot[id]) { dirty = true; break; }
    }
    if (dirty) {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.textContent = 'Save rules';
      const hint = btn.nextElementSibling;
      if (hint) hint.style.display = 'none';
    }
  }

  for (const id of ids) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', enableSave);
    if (el && el.type === 'number') el.addEventListener('input', enableSave);
  }
}

async function saveSettings() {
  const err = document.getElementById('settings-err');
  err.textContent = '';
  err.style.color = '';

  const settings = {
    rosterSize:          parseInt(document.getElementById('set-rosterSize').value) || 6,
    redraftCadence:      document.getElementById('set-redraftCadence').value,
    positionRule:        document.getElementById('set-positionRule').value,
    teamRule:            document.getElementById('set-teamRule').value,
    multiPlayerPerTeam:  document.getElementById('set-multiPlayerPerTeam').value === 'true',
    scoringCategories:   [...document.getElementById('set-scoringCategories').selectedOptions].map(o => o.value),
    irSlots:             parseInt(document.getElementById('set-irSlots').value) || 0,
    irMode:              document.getElementById('set-irMode').value,
    irHrCarryover:       document.getElementById('set-irHrCarryover').value,
    irReplacementRule:   document.getElementById('set-irReplacementRule').value,
    waiverType:          document.getElementById('set-waiverType').value,
  };

  const res = await leagueAction('settings', { settings });
  if (res?.ok) {
    // Verify the server actually saved what we sent — catches stale deployment issues
    const savedIrSlots = res.settings?.irSlots;
    const sentIrSlots = settings.irSlots;
    if (sentIrSlots > 0 && savedIrSlots != sentIrSlots) {
      err.textContent = `⚠ Server did not save IR slots (got ${savedIrSlots}, sent ${sentIrSlots}). The backend may need redeploying.`;
      err.style.color = 'var(--orange)';
      return;
    }

    // Update in memory immediately
    CURRENT_LEAGUE.league.settings = { ...CURRENT_LEAGUE.league.settings, ...settings };
    // Stamp a saved timestamp so the onboarding checklist detects completion
    CURRENT_LEAGUE.league.settingsSavedAt = Date.now();

    // Grey out the save button — nothing has changed yet
    const saveBtn = document.getElementById('settings-save-btn');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.style.opacity = '0.45';
      saveBtn.textContent = '✓ Saved';
    }

    // Re-render just the onboarding checklist so the settings step checks off
    const onboardEl = document.getElementById('onboard-checklist');
    if (onboardEl) onboardEl.outerHTML = renderOnboardingChecklist() || '';

    // Show confirmation banner
    const banner = document.getElementById('settings-err');
    if (banner) {
      banner.style.color = 'var(--green)';
      banner.style.fontWeight = '600';
      banner.textContent = '✓ Settings saved';
      setTimeout(() => {
        if (banner) { banner.textContent = ''; banner.style.color = ''; banner.style.fontWeight = ''; }
      }, 4000);
    }
  } else {
    err.textContent = res?.error || 'Failed to save';
  }
}

async function leagueAction(action, payload) {
  try {
    const r = await fetch(API_LEAGUE, {
      method: 'POST',
      headers: {'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ action, leagueId: CURRENT_LEAGUE.league.id, ...payload }),
    });
    const res = await r.json();
    if (!res.ok) toastErr(res.error || 'Action failed');
    return res;
  } catch (e) {
    toastErr('Connection failed');
    return null;
  }
}

// ── PUSH NOTIFICATION ONBOARDING PROMPT ──
// Shows a bottom banner the first time a user opens the app on mobile
// (or from the PWA Home Screen icon) prompting them to enable notifications.
// Dismissed state is stored in sessionStorage so it reappears next session
// (not every page load, but each time they open the app fresh).
// Only shows if:
//   - User is signed in
//   - Push API is available (i.e. on PWA or modern browser)
//   - Not already subscribed (checked via the push endpoint)
//   - Not already dismissed this session
async function maybeShowNotificationPrompt() {
  if (!SESSION) return;
  if (sessionStorage.getItem('notif-prompt-dismissed')) return;
  if (!('PushManager' in window) || !('serviceWorker' in navigator)) return;

  // Check if already subscribed
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) return; // already subscribed — no need to prompt
  } catch { return; }

  // Already shown this session?
  if (document.getElementById('notif-prompt-banner')) return;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);

  // On iOS not in standalone — can't enable push yet, don't show prompt
  if (isIOS && !isStandalone) return;

  const banner = document.createElement('div');
  banner.id = 'notif-prompt-banner';
  banner.style.cssText = `
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: linear-gradient(135deg, rgba(13,22,41,0.97), rgba(26,47,89,0.97));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(96,165,250,0.3);
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    animation: slideUp 0.3s ease;
  `;
  banner.innerHTML = `
    <style>@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }</style>
    <div style="font-size:26px;flex-shrink:0">🔔</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14px;color:var(--text);margin-bottom:2px">Get HR notifications</div>
      <div style="font-size:12px;color:var(--text-muted);line-height:1.4">Know the instant one of your players goes yard — before you check the score.</div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="dismissNotifPrompt()" style="background:none;border:1px solid rgba(255,255,255,0.15);color:var(--text-muted);border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer">Later</button>
      <button onclick="enableNotifFromPrompt()" style="background:var(--blue);color:white;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer">Enable</button>
    </div>
  `;
  document.body.appendChild(banner);
}

function dismissNotifPrompt() {
  sessionStorage.setItem('notif-prompt-dismissed', '1');
  const b = document.getElementById('notif-prompt-banner');
  if (b) b.remove();
}

async function enableNotifFromPrompt() {
  dismissNotifPrompt(); // remove banner first
  // Navigate to Settings tab where the full notification panel is
  if (CURRENT_LEAGUE) {
    navigate(`/league/${encodeURIComponent(CURRENT_LEAGUE.league.id)}/my-settings`);
  }
  // Trigger notification permission directly
  try {
    const info = await (await fetch(API_PUSH, { headers: authHeaders() })).json();
    if (!info.publicKey) return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(info.publicKey),
    });
    await fetch(API_PUSH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ action: 'subscribe', subscription: sub.toJSON() }),
    });
    // Refresh the settings panel to show updated subscription state
    if (CURRENT_TAB === 'my-settings') renderNotificationsPanelInto('notif-panel-settings');
  } catch (e) {
    console.warn('Notification enable from prompt failed:', e.message);
  }
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function normName(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim(); }
function ordinal(n) { const s = ['th','st','nd','rd']; const v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

(async function init() {
  renderAccountChip();

  // Register service worker and check for updates on every load.
  // This is what makes iOS PWA pick up new versions — without an explicit
  // update() call, iOS can cache the old SW for days.
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      // Force update check — critical for iOS PWA to detect new versions
      reg.update().catch(() => {});
    } catch (e) {
      console.log('SW registration failed:', e);
    }
  }

  if (SESSION) {
    try {
      const r = await fetch(API_AUTH, { headers: authHeaders(), cache: 'no-store' });
      const info = await r.json();
      if (!info.me) setSession(null);
      else setSession({ ...SESSION, isAdmin: info.me.isAdmin, displayName: info.me.displayName || SESSION.displayName, photoUrl: info.me.photoUrl || SESSION.photoUrl || '', hrEmoji: info.me.hrEmoji || SESSION.hrEmoji || '', rivalMessage: info.me.rivalMessage || SESSION.rivalMessage || '' });
    } catch {}
  }
  await renderRoute();
})();
</script>
