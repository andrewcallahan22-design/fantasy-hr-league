[build]
  publish = "."
  functions = "netlify/functions"

# Route all /.netlify/functions/* calls to the functions directory
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — send all non-function, non-asset routes to index.html
# so client-side routing (/admin, /league/*, /join/*, etc.) works on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: we use external cron (cron-job.org) hitting /run-sync?leagueId=...
# to drive syncs every minute. Netlify free tier scheduled functions only
# support hourly intervals, so they're disabled here in favor of the external job.
