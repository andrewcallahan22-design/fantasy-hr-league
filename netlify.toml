[build]
  publish = "."
  functions = "netlify/functions"

# Never cache index.html — always serve the latest version.
# This is critical for a PWA where users have the app pinned to their home screen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Never cache the service worker either
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Static assets (icons, manifest) can be cached
[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# SPA fallback — send all non-function, non-asset routes to index.html
# so client-side routing (/admin, /league/*, /join/*, etc.) works on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
